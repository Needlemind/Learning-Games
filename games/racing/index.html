<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Number Race!</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Nunito', 'Comic Sans MS', cursive;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 80px 12px 28px;
      user-select: none;
      gap: 14px;
      overflow: hidden;
      background: linear-gradient(to bottom,
        #87CEEB 0%, #b0e0ff 45%,
        #c8b880 47%, #b8a870 52%,
        #6a8a3a 54%, #4a6a2a 100%);
    }

    /* ── Header ─────────────────────────────────────────────────── */
    .game-header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 10;
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px;
      background: rgba(0,0,0,0.2);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .game-title {
      font-size: clamp(1.3rem, 5.5vw, 1.8rem);
      font-weight: 900; color: #fff;
      text-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    .nav-btn {
      width: 44px; height: 44px; border-radius: 50%;
      background: rgba(255,255,255,0.2); border: none;
      font-size: 20px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      text-decoration: none; color: inherit;
      transition: transform 0.15s cubic-bezier(0.34,1.56,0.64,1);
    }
    .nav-btn:active { transform: scale(0.88); }

    /* ── Race track ─────────────────────────────────────────────── */
    #track-wrap {
      width: 100%; max-width: 680px;
      position: relative; z-index: 1;
    }

    #track {
      width: 100%;
      background: #555;
      border-radius: 14px;
      border: 4px solid #333;
      overflow: hidden;
      box-shadow: 0 6px 20px rgba(0,0,0,0.35);
      position: relative;
    }

    #finish-line {
      position: absolute; top: 0; right: 0; bottom: 0;
      width: 30px;
      background: repeating-conic-gradient(#000 0% 25%, #fff 0% 50%) 0 0 / 15px 15px;
      z-index: 4;
      border-left: 3px solid #222;
    }

    #start-line {
      position: absolute; top: 0; left: 44px; bottom: 0;
      width: 3px; background: rgba(255,255,255,0.45); z-index: 4;
    }

    .lane {
      height: 68px;
      position: relative;
      display: flex; align-items: center;
      border-bottom: 2px dashed rgba(255,255,255,0.25);
    }
    .lane:last-child { border-bottom: none; }
    .lane:nth-child(odd)  { background: #606060; }
    .lane:nth-child(even) { background: #525252; }

    .lane-tag {
      position: absolute; right: 38px; top: 50%;
      transform: translateY(-50%);
      font-size: 0.7rem; font-weight: 800;
      color: rgba(255,255,255,0.35); letter-spacing: 1px;
      z-index: 3;
    }

    .car {
      position: absolute;
      font-size: 2rem; line-height: 1;
      transition: left 0.65s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      filter: drop-shadow(2px 4px 5px rgba(0,0,0,0.4));
      transform: scaleX(-1);
      z-index: 5;
    }
    .car.player { font-size: 2.5rem; }

    /* ── Question card ──────────────────────────────────────────── */
    #question-card {
      width: 100%; max-width: 680px;
      background: rgba(255,252,240,0.96);
      border-radius: 22px;
      border: 4px solid #c8a060;
      padding: 18px 16px 20px;
      display: flex; flex-direction: column;
      align-items: center; gap: 10px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.18);
      position: relative; z-index: 1;
    }

    #question-text {
      font-size: clamp(2.2rem, 10vw, 3.8rem);
      font-weight: 900; color: #2c3e50;
      letter-spacing: 2px;
    }

    #message {
      font-size: clamp(1rem, 4vw, 1.3rem);
      font-weight: 800;
      color: #e74c3c;
      min-height: 1.5rem; text-align: center;
    }

    #hear-btn {
      background: linear-gradient(145deg, #ffe066, #f5c518);
      border: 3px solid #a07800; border-radius: 50px;
      padding: 8px 22px; font-size: 1.05rem;
      font-family: inherit; font-weight: 800; color: #5c3a00;
      cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.12);
      transition: transform 0.15s cubic-bezier(0.34,1.56,0.64,1);
    }
    #hear-btn:active { transform: scale(0.93); }

    #answer-row {
      display: flex; gap: 10px;
      justify-content: center; flex-wrap: wrap;
      width: 100%;
    }

    .ans-btn {
      min-width: clamp(62px, 18vw, 84px);
      height: clamp(62px, 18vw, 84px);
      border-radius: 16px;
      border: 4px solid rgba(0,0,0,0.15);
      font-family: inherit;
      font-size: clamp(1.5rem, 6vw, 2.2rem);
      font-weight: 900; color: #fff; cursor: pointer;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
      box-shadow: 0 6px 0 rgba(0,0,0,0.22), 0 8px 16px rgba(0,0,0,0.12);
      transition: transform 0.15s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.1s;
    }
    .ans-btn:active { transform: translateY(5px) scale(0.95); box-shadow: 0 1px 0 rgba(0,0,0,0.2); }
    .ans-btn.wrong  { animation: shake 0.4s ease; }
    .ans-btn.right  { animation: pop 0.3s ease; }

    @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-9px)} 40%{transform:translateX(9px)} 60%{transform:translateX(-9px)} 80%{transform:translateX(9px)} }
    @keyframes pop   { 0%{transform:scale(1)} 50%{transform:scale(1.22)} 100%{transform:scale(1)} }

    /* ── Win screen ─────────────────────────────────────────────── */
    #win-screen {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.45);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 30; opacity: 0; pointer-events: none;
      transition: opacity 0.3s; gap: 14px;
    }
    #win-screen.show { opacity: 1; pointer-events: all; }
    #win-trophy { font-size: clamp(80px, 24vw, 130px); animation: bounce 0.5s ease infinite alternate; }
    #win-text   { font-size: clamp(1.8rem, 7vw, 3rem); font-weight: 900; color: #fff; text-shadow: 3px 3px 0 rgba(0,0,0,0.3); text-align: center; padding: 0 20px; }
    #race-again-btn {
      margin-top: 8px; padding: 16px 44px;
      font-size: clamp(1.2rem, 5vw, 1.6rem); font-family: inherit; font-weight: 900;
      background: linear-gradient(145deg, #e74c3c, #c0392b);
      border: 3px solid #922b21; border-radius: 50px; color: #fff; cursor: pointer;
      box-shadow: 0 5px 14px rgba(0,0,0,0.3);
      transition: transform 0.15s cubic-bezier(0.34,1.56,0.64,1);
    }
    #race-again-btn:active { transform: scale(0.93); }
    @keyframes bounce { from{transform:scale(1) translateY(0)} to{transform:scale(1.1) translateY(-16px)} }

    /* ── Settings panel ─────────────────────────────────────────── */
    #settings-panel {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 25; display: none;
      align-items: center; justify-content: center;
    }
    #settings-panel.open { display: flex; }
    #settings-box {
      background: #fff; border-radius: 24px;
      padding: 28px 24px; width: min(380px, 90vw);
      display: flex; flex-direction: column; gap: 16px;
    }
    .settings-title { font-size: 1.5rem; font-weight: 900; color: #2c3e50; text-align: center; }
    .settings-row {
      display: flex; align-items: center; justify-content: space-between;
      background: #f8f9fa; border-radius: 12px; padding: 12px 16px;
    }
    .settings-label { font-size: 1rem; color: #2c3e50; font-weight: 800; }
    .settings-sub   { font-size: 0.8rem; color: #7f8c8d; }
    .toggle-btn {
      padding: 8px 20px; border-radius: 50px;
      border: 3px solid #aaa; background: #ddd;
      font-family: inherit; font-size: 0.95rem;
      font-weight: 800; color: #666; cursor: pointer;
      transition: background 0.2s, border-color 0.2s, color 0.2s;
    }
    .toggle-btn.on { background: linear-gradient(145deg,#4cbf4c,#2a8a2a); border-color: #1a5a1a; color: #fff; }
    .range-picker { display: flex; gap: 8px; }
    .range-btn {
      padding: 8px 12px; border-radius: 12px;
      border: 3px solid #aaa; background: #eee;
      font-family: inherit; font-size: 0.9rem;
      font-weight: 800; color: #666; cursor: pointer;
      transition: all 0.2s;
    }
    .range-btn.active { background: linear-gradient(145deg,#f5c518,#e08000); border-color: #8B5500; color: #fff; }
    .close-settings-btn {
      padding: 14px; border-radius: 50px; border: none;
      background: #e74c3c; font-family: inherit;
      font-size: 1.1rem; font-weight: 900; color: #fff; cursor: pointer;
      transition: transform 0.15s cubic-bezier(0.34,1.56,0.64,1);
    }
    .close-settings-btn:active { transform: scale(0.93); }

    .confetti-piece { position:fixed; animation:fall linear forwards; pointer-events:none; }
    @keyframes fall { 0%{transform:translateY(-20px) rotate(0deg);opacity:1} 100%{transform:translateY(110vh) rotate(720deg);opacity:0} }
    #streak-bar{display:flex;gap:8px;justify-content:center;padding:4px 0 0;font-size:clamp(22px,6vw,30px);line-height:1;position:fixed;top:60px;left:0;right:0;z-index:11;}
    .star.lit{filter:drop-shadow(0 2px 6px rgba(255,180,0,0.9));}
  </style>
</head>
<body>

<header class="game-header">
  <a href="../../" class="nav-btn" aria-label="Home">🏠</a>
  <span class="game-title">🏎️ Number Race!</span>
  <button class="nav-btn" id="settings-btn" aria-label="Settings">⚙️</button>
</header>
<div id="streak-bar"><span class="star" id="s1">☆</span><span class="star" id="s2">☆</span><span class="star" id="s3">☆</span></div>

<div id="track-wrap">
  <div id="track">
    <div id="finish-line"></div>
    <div id="start-line"></div>
  </div>
</div>

<div id="question-card">
  <div id="question-text"></div>
  <button id="hear-btn" onclick="hearSum()">🔊 Hear the sum</button>
  <div id="message"></div>
  <div id="answer-row"></div>
</div>

<div id="win-screen">
  <div id="win-trophy">🏆</div>
  <div id="win-text">You won the race!</div>
  <button id="race-again-btn">Race again! 🏎️</button>
</div>

<div id="settings-panel">
  <div id="settings-box">
    <div class="settings-title">⚙️ Settings</div>
    <div class="settings-row">
      <div class="settings-label">🔢 Number range</div>
      <div class="range-picker">
        <button class="range-btn" data-range="5">1–5</button>
        <button class="range-btn" data-range="10">1–10</button>
        <button class="range-btn" data-range="20">1–20</button>
      </div>
    </div>
    <div class="settings-row">
      <div>
        <div class="settings-label">➖ Subtraction</div>
        <div class="settings-sub">Unlock take-away questions</div>
      </div>
      <button class="toggle-btn" id="sub-toggle">OFF</button>
    </div>
    <button class="close-settings-btn" id="close-settings-btn">Let's race! 🏎️</button>
  </div>
</div>

<script>
// ── Settings ───────────────────────────────────────────────────────────────
let settings = { subtraction: false, range: 5 };

function loadSettings() {
  try { const s = localStorage.getItem('nr_settings'); if (s) settings = { ...settings, ...JSON.parse(s) }; } catch(e) {}
}
function saveSettings() {
  try { localStorage.setItem('nr_settings', JSON.stringify(settings)); } catch(e) {}
}
function refreshSettingsUI() {
  const sub = document.getElementById('sub-toggle');
  sub.textContent = settings.subtraction ? 'ON' : 'OFF';
  sub.className = 'toggle-btn' + (settings.subtraction ? ' on' : '');
  document.querySelectorAll('.range-btn').forEach(btn => {
    btn.classList.toggle('active', Number(btn.dataset.range) === settings.range);
  });
}

document.getElementById('sub-toggle').addEventListener('click', () => {
  settings.subtraction = !settings.subtraction;
  saveSettings(); refreshSettingsUI();
});
document.querySelectorAll('.range-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    settings.range = Number(btn.dataset.range);
    saveSettings(); refreshSettingsUI();
  });
});
document.getElementById('settings-btn').addEventListener('click', () => {
  refreshSettingsUI();
  document.getElementById('settings-panel').classList.add('open');
});
document.getElementById('close-settings-btn').addEventListener('click', () => {
  document.getElementById('settings-panel').classList.remove('open');
});

// ── Cars ───────────────────────────────────────────────────────────────────
const CAR_DEFS = [
  { id: 'player', emoji: '🏎️', label: 'YOU', isPlayer: true  },
  { id: 'ai1',    emoji: '🚗', label: '',    isPlayer: false },
  { id: 'ai2',    emoji: '🚕', label: '',    isPlayer: false },
];

const ANS_COLORS = ['#E74C3C', '#3498DB', '#2ECC71', '#F39C12'];

const CAR_START = 5;
const CAR_END   = 85;

let carProgress = {};

function carLeftPct(progress) {
  return CAR_START + (progress / 100) * (CAR_END - CAR_START);
}

function buildTrack() {
  const track = document.getElementById('track');
  track.querySelectorAll('.lane').forEach(l => l.remove());

  CAR_DEFS.forEach(def => {
    const lane = document.createElement('div');
    lane.className = 'lane';

    if (def.label) {
      const tag = document.createElement('span');
      tag.className = 'lane-tag';
      tag.textContent = def.label;
      lane.appendChild(tag);
    }

    const car = document.createElement('div');
    car.className = 'car' + (def.isPlayer ? ' player' : '');
    car.id = 'car-' + def.id;
    car.textContent = def.emoji;
    car.style.left = carLeftPct(0) + '%';
    lane.appendChild(car);

    track.insertBefore(lane, document.getElementById('finish-line'));
    carProgress[def.id] = 0;
  });
}

function moveCar(id, delta, cap = 100) {
  carProgress[id] = Math.min(cap, carProgress[id] + delta);
  const el = document.getElementById('car-' + id);
  if (el) el.style.left = carLeftPct(carProgress[id]) + '%';
}

function resetCars() {
  CAR_DEFS.forEach(def => {
    carProgress[def.id] = 0;
    const el = document.getElementById('car-' + def.id);
    if (el) el.style.left = carLeftPct(0) + '%';
  });
}

// ── Audio ──────────────────────────────────────────────────────────────────
let streak = 0;
function playTone(type){try{const ctx=new(window.AudioContext||window.webkitAudioContext)();if(type==='correct'){[[523,0],[659,0.1],[784,0.2]].forEach(([freq,t])=>{const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=freq;o.type='sine';g.gain.setValueAtTime(0,ctx.currentTime+t);g.gain.linearRampToValueAtTime(0.28,ctx.currentTime+t+0.01);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+t+0.28);o.start(ctx.currentTime+t);o.stop(ctx.currentTime+t+0.32);});}else{const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.type='sine';o.frequency.setValueAtTime(280,ctx.currentTime);o.frequency.exponentialRampToValueAtTime(90,ctx.currentTime+0.3);g.gain.setValueAtTime(0.3,ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.35);o.start(ctx.currentTime);o.stop(ctx.currentTime+0.4);}}catch(e){}}
function updateStreak(hit){if(hit){streak++;}else{streak=0;}const show=Math.min(streak,3);['s1','s2','s3'].forEach((id,i)=>{const el=document.getElementById(id);if(i<show){el.textContent='⭐';el.classList.add('lit');}else{el.textContent='☆';el.classList.remove('lit');}});if(streak===3){streak=0;setTimeout(()=>speak('Three in a row! Amazing!'),800);}}

// ── Speech ─────────────────────────────────────────────────────────────────
function hearSum() { if (currentQ) speak(currentQ.text.replace('−', 'minus').replace('=', 'equals')); }

function speak(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.rate = 0.88; u.pitch = 1.1; u.lang = 'en-GB';
  speechSynthesis.speak(u);
}

// ── Question generation ────────────────────────────────────────────────────
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function generateQuestion() {
  const max = settings.range;
  let a, b, answer, text;
  const useSub = settings.subtraction && Math.random() < 0.4;

  if (useSub) {
    answer = Math.floor(Math.random() * (max - 1)) + 1;
    b = Math.floor(Math.random() * (max - answer)) + 1;
    a = answer + b;
    text = `${a} − ${b} = ?`;
  } else {
    a = Math.floor(Math.random() * (max - 1)) + 1;
    b = Math.floor(Math.random() * (max - a)) + 1;
    answer = a + b;
    text = `${a} + ${b} = ?`;
  }

  const opts = new Set([answer]);
  let attempts = 0;
  while (opts.size < 4 && attempts < 100) {
    attempts++;
    const c = Math.floor(Math.random() * max) + 1;
    if (c !== answer) opts.add(c);
  }
  for (let n = 1; opts.size < 4; n++) { if (!opts.has(n)) opts.add(n); }

  return { answer, text, options: shuffle([...opts].slice(0, 4)) };
}

// ── Game state ─────────────────────────────────────────────────────────────
let currentQ = null;
let blocked   = false;

function renderQuestion(q) {
  document.getElementById('question-text').textContent = q.text;
  document.getElementById('message').textContent = '';
  const row = document.getElementById('answer-row');
  row.innerHTML = '';
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'ans-btn';
    btn.style.background = ANS_COLORS[i];
    btn.textContent = opt;
    btn.addEventListener('click', () => onAnswer(opt, btn));
    row.appendChild(btn);
  });
}

function onAnswer(val, btn) {
  if (blocked) return;
  if (val === currentQ.answer) {
    blocked = true;
    playTone('correct'); updateStreak(true);
    btn.classList.add('right');

    moveCar('player', 22);
    moveCar('ai1', Math.floor(Math.random() * 8) + 4, 88);
    moveCar('ai2', Math.floor(Math.random() * 7) + 3, 82);

    speak('Correct! Well done!');

    setTimeout(() => {
      if (carProgress['player'] >= 100) {
        showWin();
      } else {
        blocked = false;
        currentQ = generateQuestion();
        renderQuestion(currentQ);
      }
    }, 750);
  } else {
    playTone('wrong'); updateStreak(false);
    btn.classList.remove('wrong');
    void btn.offsetWidth;
    btn.classList.add('wrong');
    btn.addEventListener('animationend', () => btn.classList.remove('wrong'), { once: true });

    moveCar('ai1', Math.floor(Math.random() * 4) + 1, 88);
    moveCar('ai2', Math.floor(Math.random() * 3) + 1, 82);

    document.getElementById('message').textContent = 'Try again! 🚦';
    speak('Try again!');
  }
}

function showWin() {
  launchConfetti();
  document.getElementById('win-screen').classList.add('show');
  speak('You won the race! Amazing driving!');
}

function startRace() {
  document.getElementById('win-screen').classList.remove('show');
  document.querySelectorAll('.confetti-piece').forEach(el => el.remove());
  blocked = false; streak = 0; updateStreak(false);
  resetCars();
  currentQ = generateQuestion();
  renderQuestion(currentQ);
}

function launchConfetti() {
  const colors = ['#E74C3C','#3498DB','#2ECC71','#F39C12','#9B59B6','#FF69B4','#fff'];
  for (let i = 0; i < 80; i++) {
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    el.style.cssText = `left:${Math.random()*100}vw;top:-20px;background:${colors[Math.floor(Math.random()*colors.length)]};border-radius:${Math.random()>.5?'50%':'3px'};width:${8+Math.random()*10}px;height:${8+Math.random()*10}px;animation-duration:${1.5+Math.random()*2}s;animation-delay:${Math.random()*0.6}s`;
    document.body.appendChild(el);
    el.addEventListener('animationend', () => el.remove());
  }
}

document.getElementById('race-again-btn').addEventListener('click', startRace);

// ── Boot ───────────────────────────────────────────────────────────────────
loadSettings();
buildTrack();
startRace();
</script>
</body>
</html>
