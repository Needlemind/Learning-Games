<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Word Farm</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Nunito', 'Comic Sans MS', cursive;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 76px 12px 52px;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
      background: linear-gradient(to bottom,
        #1c6aaa 0%, #3a8ec8 15%, #6db4e0 32%, #9dd0f2 40%,
        #b0e060 42%, #6cbf38 47%, #48a020 100%);
    }

    /* ── Header ─────────────────────────────────────────────────── */
    .game-header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 10;
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px;
      background: rgba(0,0,0,0.2);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .game-title {
      font-size: clamp(1.3rem, 5.5vw, 1.8rem);
      font-weight: 900; color: #fff;
      text-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    .nav-btn {
      width: 44px; height: 44px; border-radius: 50%;
      background: rgba(255,255,255,0.2); border: none;
      font-size: 20px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      text-decoration: none; color: inherit;
      transition: transform 0.15s cubic-bezier(0.34,1.56,0.64,1);
    }
    .nav-btn:active { transform: scale(0.88); }

    /* ── Farm background scene ───────────────────────────────── */
    #farm-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    #farm-sun {
      position: absolute;
      top: 5%; right: 9%;
      width: 66px; height: 66px;
      background: radial-gradient(circle at 38% 38%, #fffde8 20%, #ffe54a 50%, #ffc200 80%, rgba(255,140,0,0.3) 100%);
      border-radius: 50%;
      box-shadow:
        0 0 0 10px rgba(255,220,40,0.18),
        0 0 0 24px rgba(255,200,0,0.10),
        0 0 48px 20px rgba(255,180,0,0.18);
      animation: sun-pulse 4s ease-in-out infinite;
    }
    @keyframes sun-pulse {
      0%,100% { box-shadow: 0 0 0 10px rgba(255,220,40,0.18), 0 0 0 24px rgba(255,200,0,0.10), 0 0 48px 20px rgba(255,180,0,0.18); }
      50%      { box-shadow: 0 0 0 16px rgba(255,220,40,0.22), 0 0 0 34px rgba(255,200,0,0.12), 0 0 64px 28px rgba(255,180,0,0.22); }
    }

    .cloud {
      position: absolute;
      background: rgba(255,255,255,0.97);
      border-radius: 60px;
      box-shadow: 0 5px 14px rgba(100,130,200,0.10);
    }
    .cloud::before, .cloud::after {
      content: '';
      position: absolute;
      background: rgba(255,255,255,0.97);
      border-radius: 50%;
    }
    #cloud1 { width: 134px; height: 44px; top: 7%; left: 3%; animation: cloud-drift 34s ease-in-out infinite; }
    #cloud1::before { width: 70px; height: 70px; top: -35px; left: 14px; }
    #cloud1::after  { width: 54px; height: 54px; top: -27px; left: 60px; }
    #cloud2 { width: 108px; height: 36px; top: 3%; left: 42%; animation: cloud-drift 46s ease-in-out infinite 9s; }
    #cloud2::before { width: 56px; height: 56px; top: -28px; left: 12px; }
    #cloud2::after  { width: 42px; height: 42px; top: -21px; left: 50px; }
    #cloud3 { width: 90px; height: 30px; top: 11%; right: 15%; animation: cloud-drift 40s ease-in-out infinite 20s; }
    #cloud3::before { width: 46px; height: 46px; top: -23px; left: 10px; }
    #cloud3::after  { width: 36px; height: 36px; top: -18px; left: 40px; }
    @keyframes cloud-drift { 0%,100% { transform: translateX(0); } 50% { transform: translateX(24px); } }

    #hill-left  { position: absolute; bottom: 56%; left: -12%; width: 58%; height: 160px; background: radial-gradient(ellipse at 50% 100%, #4db830 55%, transparent 100%); border-radius: 50% 50% 0 0; }
    #hill-right { position: absolute; bottom: 56%; right: -10%; width: 62%; height: 130px; background: radial-gradient(ellipse at 50% 100%, #45a828 55%, transparent 100%); border-radius: 50% 50% 0 0; }

    #farm-fence {
      position: absolute; left: 0; right: 0; height: 20px; top: calc(40% - 10px);
      background: repeating-linear-gradient(90deg, #8B5E3C 0px, #8B5E3C 18px, transparent 18px, transparent 32px);
      border-top: 4px solid #6b3f18; border-bottom: 4px solid #6b3f18;
    }

    #farm-barn { position: absolute; top: calc(40% - 98px); left: 3%; }
    #barn-body { width: 72px; height: 62px; background: linear-gradient(to right, #c0392b, #a93226); border: 2px solid #7b241c; position: relative; }
    #barn-roof { position: absolute; top: -34px; left: -7px; width: 0; height: 0; border-left: 43px solid transparent; border-right: 43px solid transparent; border-bottom: 36px solid #7b241c; }
    #barn-door { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 22px; height: 30px; background: #4a2810; border-radius: 11px 11px 0 0; }
    #barn-window { position: absolute; top: 11px; right: 9px; width: 14px; height: 14px; background: #ffe090; border: 2px solid #4a2810; border-radius: 2px; }

    .farm-tree { position: absolute; filter: drop-shadow(1px 3px 5px rgba(0,0,0,0.2)); line-height: 1; }
    #tree1 { font-size: 3.4rem; top: calc(40% - 54px); left: 16%; }
    #tree2 { font-size: 2.8rem; top: calc(40% - 44px); left: 25%; }
    #tree3 { font-size: 3.2rem; top: calc(40% - 51px); right: 6%; }

    /* ── Shared card ───────────────────────────────────────────────── */
    .card {
      width: 100%; max-width: 680px;
      background: rgba(255,252,240,0.94);
      border-radius: 24px;
      border: 5px solid #8B5E3C;
      box-shadow: 0 8px 32px rgba(0,0,0,0.18);
      padding: 22px 18px 26px;
      display: flex; flex-direction: column; align-items: center; gap: clamp(7px, 2vw, 14px);
      position: relative; z-index: 1;
    }
    .card::before {
      content: ''; display: block;
      width: calc(100% + 10px); height: 10px;
      background: repeating-linear-gradient(90deg, #a07840 0px, #c8a060 12px, #a07840 24px);
      border-radius: 4px 4px 0 0;
      margin: -22px -18px 0; align-self: stretch;
    }

    /* ── Setup screen ──────────────────────────────────────────────── */
    #setup-screen { width: 100%; max-width: 680px; display: flex; flex-direction: column; align-items: center; gap: 0; position: relative; z-index: 1; }
    #setup-screen .card { gap: clamp(7px, 2vw, 16px); }

    .setup-title { font-size: clamp(1.8rem,7vw,2.6rem); color: #4a7a1e; font-weight: 900; text-shadow: 1px 1px 0 #fff; }
    .setup-sub   { font-size: 1rem; color: #7a4e1e; font-weight: 800; }

    .group-row {
      width: 100%; display: flex; align-items: center; justify-content: space-between;
      background: #fef4e0; border: 2px solid #d4a040; border-radius: 12px;
      padding: clamp(6px, 1.8vw, 10px) clamp(10px, 3vw, 14px); gap: 10px;
    }
    .group-info { display: flex; flex-direction: column; gap: 2px; }
    .group-name   { font-size: 0.85rem; font-weight: 800; color: #7a4e1e; }
    .group-sounds { font-size: 1.1rem; color: #3a3a3a; letter-spacing: 2px; }

    .toggle-btn {
      flex-shrink: 0; padding: 7px 18px;
      border-radius: 50px; border: 3px solid #aaa;
      background: #ddd; font-family: inherit;
      font-size: 0.95rem; font-weight: 800; color: #666;
      cursor: pointer; min-width: 60px;
      transition: background 0.2s, border-color 0.2s, color 0.2s;
    }
    .toggle-btn.on { background: linear-gradient(145deg,#4cbf4c,#2a8a2a); border-color: #1a5a1a; color: #fff; }

    .special-row {
      width: 100%; display: flex; align-items: center; justify-content: space-between;
      background: #e8f0fe; border: 2px solid #7a9ad0; border-radius: 12px; padding: 10px 14px;
    }
    .special-label { font-size: 1rem; color: #2a3a6a; font-weight: 800; }
    .special-sub   { font-size: 0.8rem; color: #5a6aaa; }

    .round-size-row {
      width: 100%; display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 8px;
    }
    .round-size-row label { font-size: 1rem; color: #7a4e1e; font-weight: 800; }
    .size-picker { display: flex; gap: 8px; }
    .size-btn {
      width: 48px; height: 48px; border-radius: 12px;
      border: 3px solid #aaa; background: #eee;
      font-family: inherit; font-size: 1.2rem; font-weight: 800; color: #666;
      cursor: pointer; transition: all 0.2s;
    }
    .size-btn.active { background: linear-gradient(145deg,#f5c518,#e08000); border-color: #8B5500; color: #fff; }

    #word-count-msg { font-size: 0.9rem; color: #4a7a1e; min-height: 1.2rem; font-weight: 700; }

    .play-btn {
      padding: 16px 44px; font-size: 1.5rem;
      background: linear-gradient(145deg,#4cbf4c,#2a8a2a);
      border: 3px solid #1a5a1a; border-radius: 50px;
      cursor: pointer; font-family: inherit; font-weight: 900; color: #fff;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
      box-shadow: 0 5px 14px rgba(0,0,0,0.18);
      transition: transform 0.15s cubic-bezier(0.34,1.56,0.64,1);
    }
    .play-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .play-btn:not(:disabled):active { transform: scale(0.93); }

    /* ── Game area ────────────────────────────────────────────────── */
    #game-area { width: 100%; max-width: 680px; display: none; flex-direction: column; align-items: center; gap: 10px; position: relative; z-index: 1; }

    #progress { font-size: 0.95rem; color: #7a4e1e; font-weight: 800; letter-spacing: 1px; }
    #wheat-row { font-size: 1.2rem; letter-spacing: 2px; min-height: 1.4rem; }

    #emoji-display {
      font-size: clamp(3.5rem,15vw,7rem); line-height: 1;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.15));
      animation: bob 2.6s ease-in-out infinite;
    }
    @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }

    #hear-btn {
      background: linear-gradient(145deg,#ffe066,#f5c518);
      border: 3px solid #a07800; border-radius: 50px;
      padding: 8px 22px; font-size: 1.05rem;
      font-family: inherit; font-weight: 800; color: #5c3a00;
      cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.12);
      transition: transform 0.15s cubic-bezier(0.34,1.56,0.64,1);
    }
    #hear-btn:active { transform: scale(0.93); }

    /* ── Fred fingers ─────────────────────────────────────────────── */
    #finger-section { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    #finger-label   { font-size: 0.85rem; color: #7a4e1e; font-weight: 800; }
    #finger-row     { display: flex; align-items: flex-end; gap: 7px; }
    .finger {
      width: clamp(22px, 5.5vw, 30px); height: clamp(36px, 9vw, 50px);
      background: linear-gradient(to bottom,#fde8c8 60%,#f5c890);
      border: 3px solid #c4852a;
      border-radius: 15px 15px 5px 5px;
      transition: transform 0.18s ease, background 0.2s, border-color 0.2s;
      position: relative; flex-shrink: 0;
    }
    .finger::after {
      content: ''; position: absolute;
      left: 5px; right: 5px; top: 15px; height: 2px;
      background: rgba(0,0,0,0.1); border-radius: 1px;
      box-shadow: 0 7px 0 rgba(0,0,0,0.07);
    }
    .finger.pressed { transform: translateY(16px) scaleY(0.72); background: linear-gradient(to bottom,#f5a860,#d96e10); border-color: #8B4400; }
    .finger.correct { transform: translateY(0) scaleY(1); background: linear-gradient(to bottom,#a0ee88,#4cbe40); border-color: #1a7a1a; animation: pop 0.3s ease; }
    .finger.wrong   { background: linear-gradient(to bottom,#ffaaaa,#e04040); border-color: #aa1010; }
    #finger-palm    { height: 22px; background: linear-gradient(to bottom,#fde8c8,#f5c890); border: 3px solid #c4852a; border-top: none; border-radius: 0 0 14px 14px; }

    /* ── Answer boxes ─────────────────────────────────────────────── */
    #boxes { display: flex; gap: clamp(7px, 2vw, 10px); justify-content: center; flex-wrap: wrap; }
    .box {
      min-width: clamp(52px, 15vw, 70px); height: clamp(58px, 16vw, 74px); padding: 0 6px;
      border: 5px solid #8B2635; border-radius: 10px;
      background: white;
      display: flex; align-items: center; justify-content: center;
      font-size: clamp(1.4rem, 4.5vw, 2rem); font-weight: 900; color: #4a1a22;
      cursor: pointer; position: relative;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.08), 0 3px 6px rgba(0,0,0,0.1);
      transition: background 0.2s, transform 0.15s, box-shadow 0.15s;
    }
    .box:empty::after { content: ''; position: absolute; inset: 6px; border: 2px dashed #ddd; border-radius: 4px; }
    .box.filled  { background: #fef8e8; }
    .box.correct { background: #d4f5d0; border-color: #2a7a30; color: #1a4a1e; animation: pop 0.35s ease; }
    .box.wrong   { animation: shake 0.45s ease; }
    .box.fred-pulse { transform: scale(1.22); box-shadow: 0 0 0 5px #ffd700, 0 0 18px rgba(255,215,0,0.5); z-index: 3; }
    .box.digraph::before {
      content: '★'; position: absolute; top: -12px; right: -10px;
      font-size: 0.72rem; background: #ffd700; color: #5c4000;
      border-radius: 50%; width: 20px; height: 20px;
      display: flex; align-items: center; justify-content: center; line-height: 20px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.2);
    }

    @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-9px)} 40%{transform:translateX(9px)} 60%{transform:translateX(-9px)} 80%{transform:translateX(9px)} }
    @keyframes pop   { 0%{transform:scale(1)} 50%{transform:scale(1.2)} 100%{transform:scale(1)} }

    /* ── Message ───────────────────────────────────────────────────── */
    #message { font-size: 1.7rem; font-weight: 900; color: #4a7a1e; min-height: 2.2rem; text-align: center; text-shadow: 1px 1px 0 rgba(255,255,255,0.8); }

    /* ── Tiles ───────────────────────────────────────────────────────── */
    #tiles { display: flex; gap: clamp(7px, 2vw, 10px); justify-content: center; flex-wrap: wrap; min-height: clamp(56px, 15vw, 82px); align-items: center; }
    .tile {
      min-width: clamp(48px, 13vw, 70px); height: clamp(52px, 14vw, 74px); padding: 0 clamp(4px, 1.5vw, 8px);
      border-radius: 10px;
      background: linear-gradient(160deg,#d4a55a,#a07030);
      border: 3px solid #6b4010;
      display: flex; align-items: center; justify-content: center;
      font-size: clamp(1.2rem, 4vw, 2rem); font-weight: 900; color: #fff;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.4);
      cursor: pointer;
      box-shadow: 0 5px 10px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.25);
      transition: transform 0.15s cubic-bezier(0.34,1.56,0.64,1), opacity 0.25s;
    }
    .tile.digraph { background: linear-gradient(160deg,#4a9e4a,#2d6a2d); border-color: #1a4010; }
    .tile:active  { transform: scale(0.88); }
    .tile.used    { opacity: 0; pointer-events: none; }

    /* ── Next button ─────────────────────────────────────────────── */
    #next-btn {
      display: none; padding: 14px 38px; font-size: 1.35rem;
      background: linear-gradient(145deg,#4cbf4c,#2a8a2a); border: 3px solid #1a5a1a;
      border-radius: 50px; cursor: pointer; font-family: inherit; font-weight: 900; color: #fff;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
      box-shadow: 0 5px 14px rgba(0,0,0,0.18);
      transition: transform 0.15s cubic-bezier(0.34,1.56,0.64,1);
    }
    #next-btn:active { transform: scale(0.93); }

    /* ── Round-end screen ──────────────────────────────────────────── */
    #round-end { width: 100%; max-width: 680px; display: none; flex-direction: column; align-items: center; gap: 0; position: relative; z-index: 1; }
    #round-end .card { gap: 14px; }

    .round-end-title { font-size: clamp(1.8rem,7vw,2.6rem); color: #4a7a1e; font-weight: 900; }

    .result-grid { width: 100%; display: flex; flex-direction: column; gap: 8px; }
    .result-row {
      display: flex; align-items: center; gap: 10px;
      background: #fef8e8; border: 2px solid #d4a040;
      border-radius: 12px; padding: 8px 14px;
    }
    .result-emoji { font-size: 1.8rem; flex-shrink: 0; }
    .result-word  { font-size: 1.3rem; font-weight: 900; color: #3a1a00; flex: 1; }
    .result-badge { flex-shrink: 0; background: #f5f5f5; border-radius: 8px; padding: 2px 8px; font-size: 0.9rem; font-weight: 800; }
    .result-badge.first { background: #fff3b0; color: #8B6000; }
    .result-badge.retry { background: #ffe0e0; color: #8B0000; }

    .round-score-msg { font-size: 1.1rem; color: #4a7a1e; font-weight: 800; text-align: center; }

    .action-row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
    .btn-green {
      padding: 14px 30px; font-size: 1.2rem;
      background: linear-gradient(145deg,#4cbf4c,#2a8a2a); border: 3px solid #1a5a1a;
      border-radius: 50px; cursor: pointer; font-family: inherit; font-weight: 900; color: #fff;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.25);
      box-shadow: 0 5px 12px rgba(0,0,0,0.15);
      transition: transform 0.15s cubic-bezier(0.34,1.56,0.64,1);
    }
    .btn-brown {
      padding: 14px 30px; font-size: 1.2rem;
      background: linear-gradient(145deg,#c8a060,#8B5E3C); border: 3px solid #5a3010;
      border-radius: 50px; cursor: pointer; font-family: inherit; font-weight: 900; color: #fff;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.25);
      box-shadow: 0 5px 12px rgba(0,0,0,0.15);
      transition: transform 0.15s cubic-bezier(0.34,1.56,0.64,1);
    }
    .btn-green:active, .btn-brown:active { transform: scale(0.93); }

    /* ── Tractor ───────────────────────────────────────────────────── */
    #tractor-wrap {
      position: fixed; bottom: 28px; left: -180px;
      font-size: 4rem; pointer-events: none; z-index: 10;
      filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.25)) hue-rotate(85deg) saturate(1.6);
      transform: scaleX(-1);
    }
    #tractor-wrap.go { animation: tractor-drive 5.5s linear forwards; }
    @keyframes tractor-drive { 0%{left:-180px} 100%{left:110vw} }

    /* ── Confetti ──────────────────────────────────────────────────── */
    #celebrate { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 9; }
    .confetti  { position: absolute; width: 12px; height: 12px; top: -20px; animation: fall linear forwards; }
    @keyframes fall { to{transform:translateY(110vh) rotate(720deg); opacity:0} }

    /* ── Farm strip ───────────────────────────────────────────────── */
    #farm-strip {
      position: fixed; bottom: 0; left: 0; right: 0; height: 44px;
      background: #4a8a2a; border-top: 4px solid #3a6a1a;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem; letter-spacing: 5px;
      pointer-events: none; z-index: 2;
    }
  </style>
</head>
<body>

<header class="game-header">
  <a href="../../" class="nav-btn" aria-label="Home">🏠</a>
  <span class="game-title">🌾 Word Farm</span>
  <button class="nav-btn" id="settings-btn" aria-label="Settings" onclick="showSetup()">⚙️</button>
</header>

<div id="celebrate"></div>
<div id="tractor-wrap">🚜</div>

<!-- ── Farm background ──────────────────────────────────────────── -->
<div id="farm-bg">
  <div id="farm-sun"></div>
  <div id="cloud1" class="cloud"></div>
  <div id="cloud2" class="cloud"></div>
  <div id="cloud3" class="cloud"></div>
  <div id="hill-left"></div>
  <div id="hill-right"></div>
  <div id="farm-fence"></div>
  <div id="farm-barn">
    <div id="barn-roof"></div>
    <div id="barn-body">
      <div id="barn-window"></div>
      <div id="barn-door"></div>
    </div>
  </div>
  <span class="farm-tree" id="tree1">🌳</span>
  <span class="farm-tree" id="tree2">🌲</span>
  <span class="farm-tree" id="tree3">🌳</span>
</div>

<!-- ── Setup screen ───────────────────────────────────────────── -->
<div id="setup-screen">
  <div class="card">
    <div class="setup-title">🌾 Word Farm</div>
    <div class="setup-sub">Which sounds has your child learned?</div>
    <div id="group-list"></div>
    <div class="special-row">
      <div>
        <div class="special-label">✨ Special friends</div>
        <div class="special-sub">sh · ch · th · ng</div>
      </div>
      <button class="toggle-btn" id="toggle-sf" onclick="toggleSpecial()">OFF</button>
    </div>
    <div class="round-size-row">
      <label>Words per round:</label>
      <div class="size-picker" id="size-picker"></div>
    </div>
    <div id="word-count-msg"></div>
    <button class="play-btn" id="play-btn" onclick="startSession()">Let's play! 🚜</button>
  </div>
</div>

<!-- ── Game area ─────────────────────────────────────────────── -->
<div id="game-area">
  <div class="card">
    <div id="progress"></div>
    <div id="wheat-row"></div>
    <div id="emoji-display"></div>
    <button id="hear-btn" onclick="hearWord()">🔊 Hear the word</button>
    <div id="finger-section">
      <div id="finger-label">🤚 Count the sounds</div>
      <div id="finger-row"></div>
      <div id="finger-palm"></div>
    </div>
    <div id="boxes"></div>
    <div id="message"></div>
    <div id="tiles"></div>
    <button id="next-btn" onclick="nextWord()">Next word 🚜</button>
  </div>
</div>

<!-- ── Round end ─────────────────────────────────────────────── -->
<div id="round-end">
  <div class="card">
    <div class="round-end-title" id="round-end-title"></div>
    <div class="result-grid" id="result-grid"></div>
    <div class="round-score-msg" id="round-score-msg"></div>
    <div class="action-row">
      <button class="btn-green" onclick="startNewRound()">Next round! 🚜</button>
      <button class="btn-brown" onclick="showSetup()">Settings ⚙️</button>
    </div>
  </div>
</div>

<div id="farm-strip">🌻🐄🌾🐑🚜🌾🐓🌼🐄🌾🚜🌻🐑🌾🐓🌼</div>

<script>
// ── Word list ───────────────────────────────────────────────────────────────
const ALL_WORDS = [
  // Group 1: m a s d t
  { word:'sad', emoji:'😢', phonemes:['s','a','d'], group:1 },
  { word:'mad', emoji:'😡', phonemes:['m','a','d'], group:1 },
  { word:'sat', emoji:'🪑', phonemes:['s','a','t'], group:1 },

  { word:'tin', emoji:'🥫', phonemes:['t','i','n'], group:2 },
  { word:'man', emoji:'👨', phonemes:['m','a','n'], group:2 },
  { word:'pig', emoji:'🐷', phonemes:['p','i','g'], group:2 },
  { word:'dog', emoji:'🐶', phonemes:['d','o','g'], group:2 },
  { word:'dig', emoji:'⛏️', phonemes:['d','i','g'], group:2 },
  { word:'map', emoji:'🗺️', phonemes:['m','a','p'], group:2 },
  { word:'nap', emoji:'😴', phonemes:['n','a','p'], group:2 },
  { word:'pin', emoji:'📌', phonemes:['p','i','n'], group:2 },
  { word:'tap', emoji:'🚰', phonemes:['t','a','p'], group:2 },
  { word:'pot', emoji:'🪴', phonemes:['p','o','t'], group:2 },
  // Group 3: adds c k u b f
  { word:'cat', emoji:'🐱', phonemes:['c','a','t'], group:3 },
  { word:'bat', emoji:'🦇', phonemes:['b','a','t'], group:3 },
  { word:'bug', emoji:'🐛', phonemes:['b','u','g'], group:3 },
  { word:'cup', emoji:'☕', phonemes:['c','u','p'], group:3 },
  { word:'nut', emoji:'🥜', phonemes:['n','u','t'], group:3 },
  { word:'bin', emoji:'🗑️', phonemes:['b','i','n'], group:3 },
  { word:'sun', emoji:'☀️', phonemes:['s','u','n'], group:3 },
  { word:'cob', emoji:'🌽', phonemes:['c','o','b'], group:3 },
  { word:'bud', emoji:'🌱', phonemes:['b','u','d'], group:3 },
  { word:'fog', emoji:'🌫️', phonemes:['f','o','g'], group:3 },
  { word:'fin', emoji:'🦈', phonemes:['f','i','n'], group:3 },
  // Group 4: adds e l h r j
  { word:'hen', emoji:'🐔', phonemes:['h','e','n'], group:4 },
  { word:'bed', emoji:'🛏️', phonemes:['b','e','d'], group:4 },
  { word:'leg', emoji:'🦵', phonemes:['l','e','g'], group:4 },
  { word:'jar', emoji:'🪹', phonemes:['j','a','r'], group:4 },
  { word:'elf', emoji:'🧙', phonemes:['e','l','f'], group:4 },
  { word:'log', emoji:'🪵', phonemes:['l','o','g'], group:4 },
  { word:'hat', emoji:'🎩', phonemes:['h','a','t'], group:4 },
  { word:'gem', emoji:'💎', phonemes:['g','e','m'], group:4 },
  { word:'net', emoji:'🥅', phonemes:['n','e','t'], group:4 },
  { word:'red', emoji:'🔴', phonemes:['r','e','d'], group:4 },
  { word:'run', emoji:'🏃', phonemes:['r','u','n'], group:4 },
  { word:'rod', emoji:'🎣', phonemes:['r','o','d'], group:4 },
  // Group 5: adds v y w z x
  { word:'van', emoji:'🚐', phonemes:['v','a','n'], group:5 },
  { word:'fox', emoji:'🦊', phonemes:['f','o','x'], group:5 },
  { word:'web', emoji:'🕸️', phonemes:['w','e','b'], group:5 },
  { word:'box', emoji:'📦', phonemes:['b','o','x'], group:5 },
  // Special friends: sh
  { word:'ship', emoji:'🚢', phonemes:['sh','i','p'],  group:2, special:true },
  { word:'shop', emoji:'🏪', phonemes:['sh','o','p'],  group:2, special:true },
  { word:'dish', emoji:'🍽️', phonemes:['d','i','sh'],  group:2, special:true },
  { word:'shin', emoji:'🦵', phonemes:['sh','i','n'],  group:2, special:true },
  { word:'fish', emoji:'🐟', phonemes:['f','i','sh'],  group:3, special:true },
  { word:'shut', emoji:'🚪', phonemes:['sh','u','t'],  group:3, special:true },
  { word:'bush', emoji:'🌿', phonemes:['b','u','sh'],  group:3, special:true },
  { word:'shed', emoji:'🛖', phonemes:['sh','e','d'],  group:4, special:true },
  { word:'rush', emoji:'🏃', phonemes:['r','u','sh'],  group:4, special:true },
  // Special friends: ch
  { word:'chip', emoji:'🍟', phonemes:['ch','i','p'],  group:2, special:true },
  { word:'chop', emoji:'🪓', phonemes:['ch','o','p'],  group:2, special:true },
  { word:'chin', emoji:'😬', phonemes:['ch','i','n'],  group:2, special:true },
  { word:'chat', emoji:'💬', phonemes:['ch','a','t'],  group:3, special:true },
  { word:'rich', emoji:'💰', phonemes:['r','i','ch'],  group:4, special:true },
  // Special friends: th
  { word:'path', emoji:'🛤️', phonemes:['p','a','th'],  group:2, special:true },
  { word:'thin', emoji:'📏', phonemes:['th','i','n'],  group:2, special:true },
  { word:'bath', emoji:'🛁', phonemes:['b','a','th'],  group:3, special:true },
  { word:'that', emoji:'👉', phonemes:['th','a','t'],  group:3, special:true },
  { word:'then', emoji:'➡️', phonemes:['th','e','n'],  group:4, special:true },
  { word:'with', emoji:'🤝', phonemes:['w','i','th'],  group:5, special:true },
  // Special friends: ng
  { word:'sing', emoji:'🎵', phonemes:['s','i','ng'],  group:2, special:true },
  { word:'ring', emoji:'💍', phonemes:['r','i','ng'],  group:4, special:true },
  { word:'king', emoji:'👑', phonemes:['k','i','ng'],  group:3, special:true },
  { word:'long', emoji:'📏', phonemes:['l','o','ng'],  group:4, special:true },
];

const GROUPS = [
  { id:1, label:'Group 1', sounds:'m · a · s · d · t' },
  { id:2, label:'Group 2', sounds:'i · n · p · g · o' },
  { id:3, label:'Group 3', sounds:'c · k · u · b · f' },
  { id:4, label:'Group 4', sounds:'e · l · h · r · j' },
  { id:5, label:'Group 5', sounds:'v · y · w · z · x' },
];

const ROUND_SIZES = [3, 5, 8];

const DISTRACTOR_POOL = ['m','a','s','d','t','i','n','p','g','o','c','k','u','b','f','e','l','h','r','j','v','y','w','z','x'];

// Phonics pronunciations for TTS — maps each phoneme to a sound the speech engine renders correctly
const PHONICS_SAY = {
  'm':'mmm', 'a':'ah',  's':'sss', 'd':'duh', 't':'tuh',
  'i':'ih',  'n':'nuh', 'p':'puh', 'g':'guh', 'o':'oh',
  'c':'kuh', 'k':'kuh', 'u':'uh',  'b':'buh', 'f':'fuh',
  'e':'eh',  'l':'luh', 'h':'huh', 'r':'ruh', 'j':'juh',
  'v':'vuh', 'y':'yuh', 'w':'wuh', 'z':'zed', 'x':'ks',
  'sh':'sh', 'ch':'ch', 'th':'th', 'ng':'ng',
};

// ── Settings ──────────────────────────────────────────────────────────────
let settings = { groups:[1,2], includeSpecial:false, roundSize:5 };

function loadSettings() {
  try {
    const s = localStorage.getItem('wf2_settings');
    if (s) settings = { ...settings, ...JSON.parse(s) };
  } catch(e) {}
}
function saveSettings() {
  try { localStorage.setItem('wf2_settings', JSON.stringify(settings)); } catch(e) {}
}

// ── Session / round state ─────────────────────────────────────────────────
let sessionPool  = [];
let roundWords   = [];
let roundIndex   = 0;
let roundResults = [];
let sessionScore = 0;

let placed   = [];
let tryCount = 0;

// ── Available words ─────────────────────────────────────────────────────────
function getAvailableWords() {
  return ALL_WORDS.filter(w => {
    const groupOk   = settings.groups.includes(w.group);
    const specialOk = !w.special || settings.includeSpecial;
    return groupOk && specialOk;
  });
}

// ── Audio ─────────────────────────────────────────────────────────────────────
function playTone(type){try{const ctx=new(window.AudioContext||window.webkitAudioContext)();if(type==='correct'){[[523,0],[659,0.1],[784,0.2]].forEach(([freq,t])=>{const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=freq;o.type='sine';g.gain.setValueAtTime(0,ctx.currentTime+t);g.gain.linearRampToValueAtTime(0.28,ctx.currentTime+t+0.01);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+t+0.28);o.start(ctx.currentTime+t);o.stop(ctx.currentTime+t+0.32);});}else{const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.type='sine';o.frequency.setValueAtTime(280,ctx.currentTime);o.frequency.exponentialRampToValueAtTime(90,ctx.currentTime+0.3);g.gain.setValueAtTime(0.3,ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.35);o.start(ctx.currentTime);o.stop(ctx.currentTime+0.4);}}catch(e){}}

// ── Speech ────────────────────────────────────────────────────────────────────
function speak(text, rate=0.88, pitch=1.1) {
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.rate = rate; u.pitch = pitch; u.lang = 'en-GB';
  speechSynthesis.speak(u);
}
function hearWord() { speak(roundWords[roundIndex].word, 0.82, 1.1); }
function celebrationSpeech(word) { speak(word, 0.78, 1.1); }

// ── Helpers ───────────────────────────────────────────────────────────────
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length-1; i > 0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function getDistractors(phonemes) {
  const used = new Set(phonemes);
  return shuffle(DISTRACTOR_POOL.filter(p => !used.has(p))).slice(0, settings.groups[settings.groups.length-1] <= 1 ? 1 : 2);
}

// ── Screen management ───────────────────────────────────────────────────
function showScreen(id) {
  ['setup-screen','game-area','round-end'].forEach(s => {
    const el = document.getElementById(s);
    el.style.display = (s === id) ? 'flex' : 'none';
  });
}
function showSetup() {
  showScreen('setup-screen');
  renderSetup();
}

// ── Setup screen ──────────────────────────────────────────────────────
function renderSetup() {
  const list = document.getElementById('group-list');
  list.innerHTML = '';
  list.style.cssText = 'width:100%;display:flex;flex-direction:column;gap:8px;';
  GROUPS.forEach(g => {
    const on = settings.groups.includes(g.id);
    const row = document.createElement('div');
    row.className = 'group-row';
    row.innerHTML = `
      <div class="group-info">
        <span class="group-name">${g.label}</span>
        <span class="group-sounds">${g.sounds}</span>
      </div>
      <button class="toggle-btn ${on?'on':''}" id="toggle-g${g.id}" onclick="toggleGroup(${g.id})">${on?'ON':'OFF'}</button>`;
    list.appendChild(row);
  });

  const sfOn = settings.includeSpecial;
  const sfBtn = document.getElementById('toggle-sf');
  sfBtn.textContent = sfOn ? 'ON' : 'OFF';
  sfBtn.className   = 'toggle-btn' + (sfOn ? ' on' : '');

  const picker = document.getElementById('size-picker');
  picker.innerHTML = '';
  ROUND_SIZES.forEach(n => {
    const btn = document.createElement('button');
    btn.className   = 'size-btn' + (n === settings.roundSize ? ' active' : '');
    btn.textContent = n;
    btn.onclick     = () => { settings.roundSize = n; saveSettings(); renderSetup(); };
    picker.appendChild(btn);
  });

  updateWordCount();
}

function toggleGroup(id) {
  if (settings.groups.includes(id)) {
    settings.groups = settings.groups.filter(g => g < id);
  } else {
    for (let i = 1; i <= id; i++) {
      if (!settings.groups.includes(i)) settings.groups.push(i);
    }
  }
  saveSettings();
  renderSetup();
}

function toggleSpecial() {
  settings.includeSpecial = !settings.includeSpecial;
  saveSettings();
  renderSetup();
}

function updateWordCount() {
  const n   = getAvailableWords().length;
  const el  = document.getElementById('word-count-msg');
  const btn = document.getElementById('play-btn');
  if (n === 0) {
    el.textContent  = '⚠️ No words available — turn on at least Group 1';
    el.style.color  = '#c00';
    btn.disabled    = true;
  } else {
    el.textContent  = `${n} word${n===1?'':'s'} ready to play`;
    el.style.color  = '#4a7a1e';
    btn.disabled    = false;
  }
}

// ── Session / round ─────────────────────────────────────────────────────────
function startSession() {
  sessionPool  = shuffle(getAvailableWords());
  sessionScore = 0;
  updateWheat();
  startNewRound();
}

function startNewRound() {
  if (sessionPool.length < settings.roundSize) {
    sessionPool = [...sessionPool, ...shuffle(getAvailableWords())];
  }
  const size  = Math.min(settings.roundSize, getAvailableWords().length);
  roundWords  = sessionPool.splice(0, size);
  roundIndex  = 0;
  roundResults= [];
  tryCount    = 0;
  showScreen('game-area');
  renderWord();
}

// ── Render word ────────────────────────────────────────────────────────────
function renderWord() {
  const w = roundWords[roundIndex];
  placed   = [];
  tryCount = 0;

  document.getElementById('emoji-display').textContent = w.emoji;
  document.getElementById('progress').textContent      = `Word ${roundIndex+1} of ${roundWords.length}`;
  document.getElementById('message').textContent       = '';
  document.getElementById('next-btn').style.display    = 'none';

  buildFingers(w.phonemes.length);

  const boxesEl = document.getElementById('boxes');
  boxesEl.innerHTML = '';
  w.phonemes.forEach((ph, i) => {
    const box = document.createElement('div');
    box.className   = 'box' + (ph.length > 1 ? ' digraph' : '');
    box.dataset.idx = i;
    box.onclick     = removeLastLetter;
    boxesEl.appendChild(box);
  });

  const pool    = shuffle([...w.phonemes, ...getDistractors(w.phonemes)]);
  const tilesEl = document.getElementById('tiles');
  tilesEl.innerHTML = '';
  pool.forEach((ph) => {
    const tile       = document.createElement('div');
    tile.className   = 'tile' + (ph.length > 1 ? ' digraph' : '');
    tile.textContent = ph;
    tile.onclick     = () => tapTile(tile, ph);
    tilesEl.appendChild(tile);
  });
}

// ── Tile interaction ────────────────────────────────────────────────────────────
function tapTile(tileEl, phoneme) {
  if (tileEl.classList.contains('used')) return;
  const w = roundWords[roundIndex];
  if (placed.length >= w.phonemes.length) return;

  speak(PHONICS_SAY[phoneme] || phoneme, 0.75, 1.2);

  tileEl.classList.add('used');
  placed.push({ phoneme, tileEl });

  const box = document.querySelector(`.box[data-idx="${placed.length-1}"]`);
  box.textContent = phoneme;
  box.classList.add('filled');
  pressFingers(placed.length);

  if (placed.length === w.phonemes.length) setTimeout(checkAnswer, 430);
}

function removeLastLetter() {
  if (!placed.length) return;
  const last = placed.pop();
  last.tileEl.classList.remove('used');
  const box = document.querySelector(`.box[data-idx="${placed.length}"]`);
  box.textContent = '';
  box.classList.remove('filled','correct','wrong');
  document.getElementById('message').textContent = '';
  pressFingers(placed.length);
}

function clearAll() {
  if (!placed.length) return;
  placed.forEach(p => p.tileEl.classList.remove('used'));
  placed = [];
  document.querySelectorAll('.box').forEach(b => {
    b.textContent = '';
    b.classList.remove('filled','correct','wrong');
  });
  document.getElementById('message').textContent = '';
  resetFingers();
}

// ── Check answer ─────────────────────────────────────────────────────────────
function checkAnswer() {
  const w     = roundWords[roundIndex];
  const built = placed.map(p => p.phoneme).join('');
  const right = w.phonemes.join('');
  const boxes = document.querySelectorAll('.box');

  if (built === right) {
    playTone('correct');
    boxes.forEach(b => { b.classList.remove('filled'); b.classList.add('correct'); });
    setFingersCorrect();
    document.getElementById('message').textContent = '🌾 Well done!';
    sessionScore++;
    updateWheat();
    launchConfetti();
    driveTractor();
    fredTalkAnimation(() => {
      celebrationSpeech(w.word);
      setTimeout(() => { document.getElementById('next-btn').style.display = 'block'; }, 1600);
    });
    roundResults.push({ word:w.word, emoji:w.emoji, tries:tryCount+1 });
  } else {
    tryCount++;
    playTone('wrong');
    boxes.forEach(b => b.classList.add('wrong'));
    setFingersWrong();
    document.getElementById('message').textContent = '🐄 Try again!';
    speak('Try again!', 0.88, 1.1);
    setTimeout(clearAll, 960);
  }
}

// ── Navigation ──────────────────────────────────────────────────────────────────
function nextWord() {
  roundIndex++;
  if (roundIndex >= roundWords.length) showRoundEnd();
  else renderWord();
}

function showRoundEnd() {
  showScreen('round-end');

  const firstTryCount = roundResults.filter(r => r.tries === 1).length;
  const total         = roundResults.length;

  const titles = total === firstTryCount
    ? ['🌟 Perfect round!', '🏆 Amazing farmer!', '⭐ Superstar!']
    : firstTryCount >= Math.ceil(total/2)
    ? ['🌾 Great round!', '🚜 Well done!']
    : ['🌱 Good effort!', '🐄 Keep going!'];
  document.getElementById('round-end-title').textContent = titles[Math.floor(Math.random()*titles.length)];

  const grid = document.getElementById('result-grid');
  grid.innerHTML = '';
  roundResults.forEach(r => {
    const row = document.createElement('div');
    row.className = 'result-row';
    const firstTry = r.tries === 1;
    row.innerHTML = `
      <span class="result-emoji">${r.emoji}</span>
      <span class="result-word">${r.word}</span>
      <span class="result-badge ${firstTry?'first':'retry'}">${firstTry ? '⭐ first try!' : `✓ ${r.tries} tries`}</span>`;
    grid.appendChild(row);
  });

  document.getElementById('round-score-msg').textContent =
    `${firstTryCount} out of ${total} on the first try 🌾`;

  const msg = firstTryCount === total
    ? 'Perfect round! Every single word first time!'
    : `Well done! ${firstTryCount} out of ${total} on the first try!`;
  setTimeout(() => speak(msg, 0.88, 1.1), 400);
}

// ── Fred fingers ─────────────────────────────────────────────────────────────────
function buildFingers(count) {
  const row  = document.getElementById('finger-row');
  const palm = document.getElementById('finger-palm');
  row.innerHTML = '';
  for (let i = 0; i < count; i++) {
    const f = document.createElement('div');
    f.className = 'finger';
    row.appendChild(f);
  }
  palm.style.width = Math.max(60, count * 37 - 7) + 'px';
}
function pressFingers(n) {
  document.querySelectorAll('.finger').forEach((f, i) => { f.classList.toggle('pressed', i < n); });
}
function setFingersCorrect() {
  document.querySelectorAll('.finger').forEach(f => { f.classList.remove('pressed','wrong'); f.classList.add('correct'); });
}
function setFingersWrong() {
  document.querySelectorAll('.finger').forEach(f => { f.classList.remove('pressed','correct'); f.classList.add('wrong'); });
}
function resetFingers() {
  document.querySelectorAll('.finger').forEach(f => { f.classList.remove('pressed','correct','wrong'); });
}

function fredTalkAnimation(onDone) {
  const boxes = [...document.querySelectorAll('.box')];
  let i = 0;
  function pulse() {
    if (i >= boxes.length) { onDone(); return; }
    boxes[i].classList.add('fred-pulse');
    setTimeout(() => {
      boxes[i].classList.remove('fred-pulse');
      i++;
      setTimeout(pulse, 180);
    }, 900);
  }
  setTimeout(pulse, 300);
}

// ── Score ──────────────────────────────────────────────────────────────────────
function updateWheat() {
  document.getElementById('wheat-row').textContent = '🌾'.repeat(sessionScore);
}

// ── Tractor ───────────────────────────────────────────────────────────────────
function driveTractor() {
  const wrap = document.getElementById('tractor-wrap');
  wrap.classList.remove('go');
  void wrap.offsetWidth;
  wrap.classList.add('go');
  setTimeout(() => wrap.classList.remove('go'), 5600);
}

// ── Confetti ─────────────────────────────────────────────────────────────────
function launchConfetti() {
  const colors = ['#5aa33a','#ffd93d','#f5a623','#e05555','#ffffff','#a0d060','#ffe066'];
  const el     = document.getElementById('celebrate');
  for (let i = 0; i < 55; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.cssText = `
      left:${Math.random()*100}vw;
      background:${colors[Math.floor(Math.random()*colors.length)]};
      animation-duration:${1.4+Math.random()*2.2}s;
      animation-delay:${Math.random()*0.7}s;
      border-radius:${Math.random()>0.5?'50%':'3px'};
      transform:rotate(${Math.random()*360}deg);`;
    el.appendChild(c);
    setTimeout(() => c.remove(), 3800);
  }
}

// ── Boot ──────────────────────────────────────────────────────────────────────
document.addEventListener('selectstart',e=>e.preventDefault());
document.addEventListener('dragstart',e=>e.preventDefault());
loadSettings();
startSession();
</script>
