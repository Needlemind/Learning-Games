<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Dress the Princess!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
    body {
      font-family: 'Nunito', 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(160deg, #fce4ec 0%, #f8bbd0 60%, #fce4ec 100%);
      height: 100svh;
      display: flex; flex-direction: column; align-items: center;
      overflow: hidden; user-select: none; touch-action: manipulation;
    }
    .game-header {
      width: 100%; display: flex; align-items: center; justify-content: space-between;
      padding: 10px 16px; flex-shrink: 0;
    }
    .nav-btn {
      background: rgba(255,255,255,0.45); border: none; border-radius: 50%;
      width: 44px; height: 44px; font-size: 20px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      text-decoration: none; flex-shrink: 0;
    }
    .nav-btn:active { background: rgba(255,255,255,0.7); transform: scale(0.9); }
    .game-title {
      font-size: clamp(16px,4.5vw,22px); font-weight: 900; color: #c2185b;
      text-shadow: 0 1px 4px rgba(255,255,255,0.7);
    }
    #princess-area {
      flex-shrink: 0;
      height: clamp(220px, 50svh, 360px);
      display: flex; align-items: center; justify-content: center;
    }
    #princess-svg {
      height: 100%; width: auto; overflow: visible;
      filter: drop-shadow(0 8px 22px rgba(194,24,91,0.18));
    }
    .item-layer {
      opacity: 0;
      transform-box: fill-box; transform-origin: center;
    }
    .item-layer.show {
      animation: item-pop 0.55s cubic-bezier(0.34,1.56,0.64,1) forwards;
    }
    @keyframes item-pop {
      0%   { opacity: 0; transform: scale(0.1) rotate(-20deg); }
      60%  { opacity: 1; transform: scale(1.2) rotate(6deg); }
      100% { opacity: 1; transform: scale(1) rotate(0deg); }
    }
    #princess-svg.celebrate {
      animation: princess-bounce 0.48s ease infinite alternate;
    }
    @keyframes princess-bounce {
      from { transform: translateY(0); }
      to   { transform: translateY(-14px) scale(1.03); }
    }
    #items-area {
      flex: 1; min-height: 0; width: 100%; max-width: 480px;
      display: flex; flex-direction: column;
      padding: clamp(8px,2svh,16px) clamp(14px,4vw,24px) clamp(8px,1.5svh,14px);
      gap: clamp(6px,1.2svh,10px);
    }
    #items-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: clamp(8px,2vw,16px);
      flex: 1; min-height: 0; align-content: center;
    }
    .item-btn {
      border: none; border-radius: clamp(18px,5vw,28px);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: clamp(3px,0.8svh,7px); cursor: pointer; padding: 8px 4px;
      max-height: clamp(72px,19svh,130px);
      background: linear-gradient(145deg, #f06292, #e91e63);
      box-shadow: 0 7px 20px rgba(233,30,99,0.38), 0 2px 6px rgba(233,30,99,0.2);
      transition: transform 0.15s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.15s;
      position: relative; overflow: hidden;
    }
    .item-btn:active { transform: scale(0.90) !important; }
    .item-btn.done {
      background: linear-gradient(145deg, #f8bbd0, #f48fb1);
      box-shadow: 0 4px 10px rgba(244,143,177,0.25);
      pointer-events: none;
    }
    .item-icon  { font-size: clamp(30px,8.5vw,50px); line-height: 1; }
    .item-label {
      font-size: clamp(13px,3.5vw,18px); font-weight: 900; color: white;
      text-shadow: 0 1px 4px rgba(0,0,0,0.18); line-height: 1;
    }
    .done-tick {
      position: absolute; top: 5px; right: 9px;
      font-size: clamp(16px,4.5vw,24px); color: white;
      opacity: 0; transition: opacity 0.25s; font-weight: 900;
    }
    .item-btn.done .done-tick { opacity: 1; }
    .spark { position: fixed; border-radius: 50%; pointer-events: none; z-index: 15; }
    #win-screen {
      position: fixed; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: rgba(252,228,236,0.95); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      z-index: 20; opacity: 0; pointer-events: none; transition: opacity 0.4s;
    }
    #win-screen.show { opacity: 1; pointer-events: all; }
    .win-emoji { font-size: clamp(72px,20vw,115px); animation: big-bounce 0.5s ease infinite alternate; }
    @keyframes big-bounce { from{transform:scale(1)} to{transform:scale(1.15) translateY(-12px)} }
    .win-text { font-size: clamp(36px,10vw,64px); font-weight: 900; color: #c2185b; margin-top: 10px;
      text-shadow: 0 2px 10px rgba(255,255,255,0.8); }
    .win-sub  { font-size: clamp(18px,5vw,28px); font-weight: 700; color: #e91e63; margin-top: 4px; }
    #again-btn {
      margin-top: 28px; font-family: 'Nunito', sans-serif;
      font-size: clamp(18px,5.5vw,28px); font-weight: 900;
      padding: 15px 46px; border-radius: 999px; border: none;
      background: linear-gradient(135deg, #f06292, #e91e63);
      color: white; cursor: pointer;
      box-shadow: 0 8px 22px rgba(233,30,99,0.42);
      transition: transform 0.15s cubic-bezier(0.34,1.56,0.64,1);
    }
    #again-btn:active { transform: scale(0.94); }
    .confetti-piece { position: fixed; animation: fall linear forwards; pointer-events: none; z-index: 19; }
    @keyframes fall { 0%{opacity:1;transform:translateY(-20px) rotate(0deg)} 100%{opacity:0.15;transform:translateY(110vh) rotate(720deg)} }
  </style>
</head>

  <script>
    const ALL_ITEMS = [
      { id:'crown',     layer:'layer-crown',     icon:'&#128081;', label:'Crown',     text:'A beautiful crown!'   },
      { id:'bow',       layer:'layer-bow',        icon:'&#127872;', label:'Bow',       text:'A pretty bow!'        },
      { id:'necklace',  layer:'layer-necklace',   icon:'&#128150;', label:'Necklace',  text:'A sparkly necklace!'  },
      { id:'wand',      layer:'layer-wand',       icon:'&#11088;',  label:'Wand',      text:'A magic wand!'        },
      { id:'butterfly', layer:'layer-butterfly',  icon:'&#129419;', label:'Butterfly', text:'A pretty butterfly!'  },
      { id:'flowers',   layer:'layer-flowers',    icon:'&#127800;', label:'Flowers',   text:'Pretty flowers!'      },
    ];

    // Colour palettes for randomisable items
    const BOW_SCHEMES = [
      { main:'#E91E63', knot:'#C2185B' },
      { main:'#7B1FA2', knot:'#6A1B9A' },
      { main:'#1565C0', knot:'#0D47A1' },
      { main:'#E65100', knot:'#BF360C' },
    ];
    const FLY_SCHEMES = [
      { upper:'#CE93D8', lower:'#AB47BC' },
      { upper:'#80CBC4', lower:'#26A69A' },
      { upper:'#90CAF9', lower:'#42A5F5' },
      { upper:'#FFCC80', lower:'#FFA726' },
    ];
    const FLOWER_SCHEMES = [
      { petal:'#FF80AB' },
      { petal:'#CE93D8' },
      { petal:'#90CAF9' },
      { petal:'#A5D6A7' },
    ];
    const CROWN_SCHEMES = [
      { a:'#E91E63', b:'#9C27B0' },
      { a:'#1976D2', b:'#00897B' },
      { a:'#F57C00', b:'#E91E63' },
      { a:'#00897B', b:'#7B1FA2' },
    ];

    const PINKS = ['#e91e63','#f48fb1','#ce93d8','#ffd54f','#ff80ab','#ea80fc','#fff176','#f8bbd0'];

    let activeItems = [], doneCount = 0;
    const svgEl = document.getElementById('princess-svg');
    const winEl = document.getElementById('win-screen');
    const btns  = Array.from(document.querySelectorAll('.item-btn'));

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length-1; i > 0; i--) {
        const j = Math.floor(Math.random()*(i+1));
        [a[i],a[j]]=[a[j],a[i]];
      }
      return a;
    }

    function speak(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.rate=0.85; u.pitch=1.3; u.lang='en-GB';
      window.speechSynthesis.speak(u);
    }
    function playTone(type){try{const ctx=new(window.AudioContext||window.webkitAudioContext)();if(type==='correct'){[[523,0],[659,0.1],[784,0.2]].forEach(([freq,t])=>{const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=freq;o.type='sine';g.gain.setValueAtTime(0,ctx.currentTime+t);g.gain.linearRampToValueAtTime(0.28,ctx.currentTime+t+0.01);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+t+0.28);o.start(ctx.currentTime+t);o.stop(ctx.currentTime+t+0.32);});}else{const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.type='sine';o.frequency.setValueAtTime(280,ctx.currentTime);o.frequency.exponentialRampToValueAtTime(90,ctx.currentTime+0.3);g.gain.setValueAtTime(0.3,ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.35);o.start(ctx.currentTime);o.stop(ctx.currentTime+0.4);}}catch(e){}}

    function pick(arr) { return arr[Math.floor(Math.random()*arr.length)]; }

    function setFill(sel, color) {
      svgEl.querySelectorAll(sel).forEach(el => el.setAttribute('fill', color));
    }
    function setStroke(sel, color) {
      svgEl.querySelectorAll(sel).forEach(el => el.setAttribute('stroke', color));
    }

    function recolour() {
      // Bow
      const bow = pick(BOW_SCHEMES);
      setFill('.bow-main', bow.main);
      setFill('.bow-knot', bow.knot);
      setStroke('.bow-tail', bow.main);
      // Butterfly
      const fly = pick(FLY_SCHEMES);
      setFill('.fly-upper', fly.upper);
      setFill('.fly-lower', fly.lower);
      // Flowers
      setFill('.fl-petal', pick(FLOWER_SCHEMES).petal);
      // Crown gems
      const cr = pick(CROWN_SCHEMES);
      setFill('.crown-gem-a', cr.a);
      setFill('.crown-gem-b', cr.b);
    }

    function setupRound() {
      activeItems = shuffle([...ALL_ITEMS]).slice(0, 4);
      btns.forEach((btn, i) => {
        const item = activeItems[i];
        btn.dataset.item = item.id;
        btn.querySelector('.item-icon').innerHTML = item.icon;
        btn.querySelector('.item-label').textContent = item.label;
        btn.classList.remove('done');
      });
      ALL_ITEMS.forEach(it => document.getElementById(it.layer).classList.remove('show'));
      recolour();
      doneCount = 0;
    }

    function burst(x, y) {
      for (let i = 0; i < 9; i++) {
        const el = document.createElement('div');
        el.className = 'spark';
        const ang = (i/9)*Math.PI*2, d = 36+Math.random()*40, s = 7+Math.random()*9;
        el.style.cssText =
          `left:${x}px;top:${y}px;width:${s}px;height:${s}px;`+
          `background:${pick(PINKS)};`+
          `animation:spark-fly 0.55s ease-out forwards;`+
          `--tx:${Math.cos(ang)*d}px;--ty:${Math.sin(ang)*d}px`;
        document.body.appendChild(el);
        el.addEventListener('animationend', () => el.remove());
      }
    }

    function launchConfetti() {
      for (let i = 0; i < 72; i++) {
        const el = document.createElement('div');
        el.className = 'confetti-piece';
        const s = 7+Math.random()*10;
        el.style.cssText =
          `left:${Math.random()*100}vw;top:-20px;`+
          `background:${pick(PINKS)};`+
          `border-radius:${Math.random()>.5?'50%':'4px'};`+
          `width:${s}px;height:${s}px;`+
          `animation-duration:${1.6+Math.random()*2}s;`+
          `animation-delay:${Math.random()*0.7}s`;
        document.body.appendChild(el);
        el.addEventListener('animationend', () => el.remove());
      }
    }

    function onTap(btn) {
      if (btn.classList.contains('done')) return;
      const item = ALL_ITEMS.find(it => it.id === btn.dataset.item);
      document.getElementById(item.layer).classList.add('show');
      btn.classList.add('done');
      const r = btn.getBoundingClientRect();
      burst(r.left+r.width/2, r.top+r.height/2);
      playTone('correct');
      speak(item.text);
      doneCount++;
      if (doneCount >= 4) {
        setTimeout(() => {
          svgEl.classList.add('celebrate');
          winEl.classList.add('show');
          speak('Beautiful! What a gorgeous princess!');
          launchConfetti();
        }, 700);
      }
    }

    function reset() {
      svgEl.classList.remove('celebrate');
      winEl.classList.remove('show');
      document.querySelectorAll('.confetti-piece').forEach(el => el.remove());
      setupRound();
    }

    document.head.insertAdjacentHTML('beforeend',`<style>
      @keyframes spark-fly{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--tx),var(--ty)) scale(0);opacity:0}}
    </style>`);

    btns.forEach(b => b.addEventListener('click', () => onTap(b)));
    document.getElementById('again-btn').addEventListener('click', reset);

    document.addEventListener('selectstart',e=>e.preventDefault());
    document.addEventListener('dragstart',e=>e.preventDefault());
    setupRound();
    setTimeout(() => speak('Dress the princess!'), 700);
  </script>
</body>
</html>
