<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Colours</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Nunito', 'Helvetica Neue', Arial, sans-serif;
      background: #fff8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
      user-select: none;
      touch-action: manipulation;
    }
    .game-header {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      flex-shrink: 0;
    }
    .nav-btn {
      background: rgba(0,0,0,0.06);
      border: none;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: background 0.12s, transform 0.1s;
      flex-shrink: 0;
    }
    .nav-btn:active { background: rgba(0,0,0,0.13); transform: scale(0.9); }
    .game-title {
      font-size: clamp(17px, 4.5vw, 22px);
      font-weight: 800;
      color: #3a3848;
    }
    #prompt-area {
      padding: 4px 20px 16px;
      text-align: center;
      flex-shrink: 0;
    }
    #tap-label {
      font-size: clamp(19px, 5.5vw, 30px);
      color: #888;
      font-weight: 700;
    }
    #colour-name {
      font-size: clamp(46px, 15vw, 92px);
      font-weight: 900;
      line-height: 1.1;
      text-shadow: 3px 4px 0 rgba(0,0,0,0.09);
    }
    #colour-name.pulse { animation: pulse 0.4s ease; }
    @keyframes pulse {
      0%   { transform: scale(1); }
      40%  { transform: scale(1.1); }
      100% { transform: scale(1); }
    }
    #grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: clamp(14px, 3.5vw, 28px);
      padding: 0 clamp(16px, 4vw, 32px) clamp(16px, 4vw, 28px);
      width: 100%;
      max-width: 520px;
      flex: 1;
      align-content: center;
    }
    .colour-btn {
      border: none;
      border-radius: clamp(18px, 5vw, 32px);
      aspect-ratio: 1;
      cursor: pointer;
      transition: transform 0.15s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.12s ease;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2), 0 2px 6px rgba(0,0,0,0.1);
    }
    .colour-btn:active { transform: scale(0.91) !important; box-shadow: 0 3px 10px rgba(0,0,0,0.15); }
    .colour-btn.wrong-shake { animation: shake 0.4s ease; }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20% { transform: translateX(-10px); }
      40% { transform: translateX(10px); }
      60% { transform: translateX(-8px); }
      80% { transform: translateX(8px); }
    }
    #celebration {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(255,248,240,0.92);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 10; opacity: 0; pointer-events: none;
      transition: opacity 0.22s;
    }
    #celebration.show { opacity: 1; pointer-events: all; }
    #celebration .emoji {
      font-size: clamp(80px, 22vw, 130px);
      animation: bounce 0.5s ease infinite alternate;
    }
    @keyframes bounce {
      from { transform: translateY(0) scale(1); }
      to   { transform: translateY(-20px) scale(1.08); }
    }
    #celebration .well-done {
      font-size: clamp(30px, 9vw, 58px);
      font-weight: 900; color: #2a2840; margin-top: 16px;
    }
    .confetti-piece { position: fixed; animation: fall linear forwards; pointer-events: none; }
    @keyframes fall {
      0%   { transform: translateY(-20px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(110vh) rotate(720deg); opacity: 0.2; }
    }
    #replay-btn {
      margin-top: 24px;
      font-family: 'Nunito', sans-serif;
      font-size: clamp(19px, 5.5vw, 30px);
      font-weight: 900;
      padding: 16px 48px;
      border-radius: 999px;
      border: none;
      background: #ff6b6b;
      color: white;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(255,107,107,0.4);
      transition: transform 0.15s cubic-bezier(0.34,1.56,0.64,1);
    }
    #replay-btn:active { transform: scale(0.94); }
  </style>
</head>
<body>
  <header class="game-header">
    <a href="../../" class="nav-btn" aria-label="Home">&#127968;</a>
    <span class="game-title">Colours</span>
    <button class="nav-btn" id="speaker-btn" aria-label="Repeat">&#128266;</button>
  </header>
  <div id="prompt-area">
    <div id="tap-label">Tap the</div>
    <div id="colour-name"></div>
  </div>
  <div id="grid"></div>
  <div id="celebration">
    <div class="emoji">&#11088;</div>
    <div class="well-done">Well done!</div>
    <button id="replay-btn">Next &#9654;</button>
  </div>
  <script>
    const COLOURS = [
      { name: 'Red',    hex: '#e63946' },
      { name: 'Blue',   hex: '#1d7fc4' },
      { name: 'Yellow', hex: '#f4b400' },
      { name: 'Green',  hex: '#2e9c4b' },
      { name: 'Orange', hex: '#f77f00' },
      { name: 'Pink',   hex: '#e84393' },
      { name: 'Purple', hex: '#7b2d8b' },
    ];
    const EMOJIS = ['🌟','🎉','🥳','⭐','🎊','✨','🦄','🌈'];
    const CELEBRATIONS = ['Well done!','Amazing!','You got it!','Brilliant!','Hooray!'];
    let target = null, blocked = false;
    const nameEl = document.getElementById('colour-name');
    const gridEl = document.getElementById('grid');
    const celebEl = document.getElementById('celebration');
    function shuffle(arr) {
      const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a;
    }
    function speak(text) {
      if(!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(text); u.rate=0.85; u.pitch=1.2;
      window.speechSynthesis.speak(u);
    }
    function newRound() {
      blocked=false; celebEl.classList.remove('show');
      document.querySelectorAll('.confetti-piece').forEach(el=>el.remove());
      const pool=shuffle(COLOURS).slice(0,4);
      target=pool[Math.floor(Math.random()*pool.length)];
      nameEl.textContent=target.name; nameEl.style.color=target.hex;
      gridEl.innerHTML='';
      pool.forEach(colour=>{
        const btn=document.createElement('button');
        btn.className='colour-btn'; btn.style.background=colour.hex;
        btn.setAttribute('aria-label',colour.name);
        btn.addEventListener('click',()=>onTap(colour,btn));
        gridEl.appendChild(btn);
      });
      nameEl.classList.remove('pulse'); void nameEl.offsetWidth; nameEl.classList.add('pulse');
      setTimeout(()=>speak('Tap the '+target.name),300);
    }
    function onTap(colour,btn) {
      if(blocked) return;
      if(colour.name===target.name) {
        blocked=true;
        celebEl.querySelector('.emoji').textContent=EMOJIS[Math.floor(Math.random()*EMOJIS.length)];
        celebEl.querySelector('.well-done').textContent=CELEBRATIONS[Math.floor(Math.random()*CELEBRATIONS.length)];
        celebEl.classList.add('show'); speak(celebEl.querySelector('.well-done').textContent); launchConfetti();
      } else {
        btn.classList.remove('wrong-shake'); void btn.offsetWidth; btn.classList.add('wrong-shake');
        speak('Try again! Tap the '+target.name);
      }
    }
    function launchConfetti() {
      const colors=COLOURS.map(c=>c.hex);
      for(let i=0;i<60;i++) {
        const el=document.createElement('div'); el.className='confetti-piece';
        el.style.cssText=`left:${Math.random()*100}vw;top:-20px;background:${colors[Math.floor(Math.random()*colors.length)]};border-radius:${Math.random()>.5?'50%':'3px'};width:${8+Math.random()*10}px;height:${8+Math.random()*10}px;animation-duration:${1.5+Math.random()*2}s;animation-delay:${Math.random()*0.6}s`;
        document.body.appendChild(el); el.addEventListener('animationend',()=>el.remove());
      }
    }
    document.getElementById('replay-btn').addEventListener('click',newRound);
    document.getElementById('speaker-btn').addEventListener('click',()=>{ if(target) speak('Tap the '+target.name); });
    newRound();
  </script>
</body>
</html>
