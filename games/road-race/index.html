<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Road Race!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Nunito', 'Helvetica Neue', Arial, sans-serif;
      background: #e0f2fe;
      height: 100svh;
      display: flex; flex-direction: column; align-items: center;
      overflow: hidden; user-select: none; touch-action: manipulation;
    }
    .game-header {
      width: 100%; display: flex; align-items: center; justify-content: space-between;
      padding: 10px 16px; flex-shrink: 0;
    }
    .nav-btn {
      background: rgba(0,0,0,0.06); border: none; border-radius: 50%;
      width: 44px; height: 44px; font-size: 20px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      text-decoration: none; flex-shrink: 0;
    }
    .nav-btn:active { background: rgba(0,0,0,0.13); transform: scale(0.9); }
    .game-title { font-size: clamp(17px,4.5vw,22px); font-weight: 800; color: #2a2840; }

    /* ─── TRACK ─── */
    #track-wrap {
      display: flex; flex-shrink: 0;
      width: 100%; max-width: 500px;
      height: clamp(165px, 35svh, 290px);
    }
    #grass-left, #grass-right {
      flex: 1;
      background: linear-gradient(to bottom, #66bb6a, #43a047);
      display: flex; flex-direction: column; justify-content: space-around;
      align-items: center; overflow: hidden; padding: 4px 0;
      font-size: clamp(14px, 3.5vw, 20px); line-height: 1;
    }
    #road {
      width: clamp(110px, 34vw, 180px); flex-shrink: 0;
      background: #555; position: relative; overflow: hidden;
    }
    /* Yellow kerb lines */
    #road::before, #road::after {
      content: ''; position: absolute; top: 0; bottom: 0; width: 5px;
      background: #f4c430; z-index: 1;
    }
    #road::before { left: 0; }
    #road::after  { right: 0; }
    /* Scrolling centre dashes */
    #road-markings {
      position: absolute; left: 50%; width: 8px;
      top: 0; height: 400%;
      background: repeating-linear-gradient(to bottom, #fff 0, #fff 18px, transparent 18px, transparent 40px);
      animation: scroll-road 0.4s linear infinite;
      animation-play-state: paused;
      transform: translateX(-50%);
      z-index: 1;
    }
    @keyframes scroll-road { to { transform: translateX(-50%) translateY(40px); } }
    #road-markings.moving { animation-play-state: running; }
    /* Checkered finish line */
    #finish-line {
      position: absolute; top: 7%; left: 5px; right: 5px; height: 14px;
      background: repeating-linear-gradient(90deg, #000 0, #000 7px, #fff 7px, #fff 14px);
      z-index: 3; border-radius: 2px;
    }
    /* Car wrapper — handles position + shake */
    #car-wrap {
      position: absolute; left: 50%; bottom: 6%;
      transform: translateX(-50%);
      z-index: 5;
      transition: bottom 0.65s cubic-bezier(0.34, 1.1, 0.64, 1);
    }
    #car-wrap.shake { animation: car-shake 0.45s ease; }
    @keyframes car-shake {
      0%,100% { transform: translateX(-50%); }
      20%     { transform: translateX(calc(-50% - 10px)); }
      40%     { transform: translateX(calc(-50% + 10px)); }
      60%     { transform: translateX(calc(-50% -  7px)); }
      80%     { transform: translateX(calc(-50% +  7px)); }
    }
    #car {
      font-size: clamp(28px, 7vw, 42px);
      display: block; line-height: 1;
      transform: rotate(-90deg);
      filter: drop-shadow(2px 2px 5px rgba(0,0,0,0.4));
    }
    /* Obstacle */
    #obstacle {
      position: absolute; left: 50%; bottom: 30%;
      transform: translateX(-50%);
      font-size: clamp(24px, 6vw, 36px);
      z-index: 4; opacity: 0; pointer-events: none;
    }
    #obstacle.pop { animation: obs-pop 1.4s ease forwards; }
    @keyframes obs-pop {
      0%   { opacity: 0; transform: translateX(-50%) scale(0.1) rotate(-15deg); }
      20%  { opacity: 1; transform: translateX(-50%) scale(1.3) rotate(8deg); }
      40%  { opacity: 1; transform: translateX(-50%) scale(1) rotate(0deg); }
      85%  { opacity: 1; transform: translateX(-50%) scale(1); }
      100% { opacity: 0; transform: translateX(-50%) scale(0.8); }
    }

    /* ─── QUESTION AREA ─── */
    #question-area {
      flex: 1; min-height: 0; width: 100%; max-width: 500px;
      display: flex; flex-direction: column;
      padding: clamp(8px,2svh,20px) clamp(14px,4vw,28px) clamp(8px,1.5svh,14px);
      gap: clamp(6px,1.5svh,14px);
      background: white; border-radius: 28px 28px 0 0;
      box-shadow: 0 -4px 24px rgba(0,0,0,0.1);
    }
    #question-display {
      flex-shrink: 0; text-align: center;
      display: flex; align-items: center; justify-content: center;
      gap: 8px; flex-wrap: wrap;
    }
    #q-emoji { font-size: clamp(22px,5.5vw,32px); line-height: 1; }
    #q-text  { font-size: clamp(16px,4.2vw,24px); font-weight: 800; color: #2a2840; line-height: 1.3; }
    #answers-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: clamp(7px,1.8vw,14px);
      flex: 1; min-height: 0; align-content: stretch;
    }
    .answer-btn {
      border: none; border-radius: clamp(14px,3.8vw,22px);
      padding: 0 8px; min-height: clamp(44px,9svh,76px);
      font-family: 'Nunito', sans-serif;
      font-size: clamp(15px,4vw,23px); font-weight: 900; color: white;
      cursor: pointer; line-height: 1.2;
      text-shadow: 0 1px 4px rgba(0,0,0,0.2);
      box-shadow: 0 6px 16px rgba(0,0,0,0.18);
      transition: transform 0.15s cubic-bezier(0.34,1.56,0.64,1);
    }
    .answer-btn:active { transform: scale(0.91); }
    .answer-btn.wrong  { animation: btn-wrong 0.4s ease; }
    @keyframes btn-wrong {
      0%,100% { transform: translateX(0); }
      25%     { transform: translateX(-9px); }
      75%     { transform: translateX(9px);  }
    }
    .answer-btn:nth-child(1) { background: #e63946; }
    .answer-btn:nth-child(2) { background: #1d7fc4; }
    .answer-btn:nth-child(3) { background: #2e9c4b; }
    .answer-btn:nth-child(4) { background: #f4a100; }

    /* ─── WIN SCREEN ─── */
    #win-screen {
      position: fixed; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: rgba(224,242,254,0.95); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      z-index: 20; opacity: 0; pointer-events: none; transition: opacity 0.3s;
    }
    #win-screen.show { opacity: 1; pointer-events: all; }
    .win-trophy { font-size: clamp(80px,22vw,130px); animation: bounce 0.5s ease infinite alternate; }
    @keyframes bounce { from{transform:translateY(0)} to{transform:translateY(-22px) scale(1.08)} }
    .win-title { font-size: clamp(30px,9vw,56px); font-weight: 900; color: #2a2840; margin-top: 12px; }
    .win-sub   { font-size: clamp(17px,4.5vw,26px); font-weight: 700; color: #555; margin-top: 6px; }
    #play-again-btn {
      margin-top: 28px; font-family: 'Nunito', sans-serif;
      font-size: clamp(18px,5vw,28px); font-weight: 900;
      padding: 15px 44px; border-radius: 999px; border: none;
      background: #e63946; color: white; cursor: pointer;
      box-shadow: 0 8px 20px rgba(230,57,70,0.4);
      transition: transform 0.15s cubic-bezier(0.34,1.56,0.64,1);
    }
    #play-again-btn:active { transform: scale(0.94); }
    .confetti-piece { position: fixed; animation: fall linear forwards; pointer-events: none; }
    @keyframes fall { 0%{opacity:1;transform:translateY(-20px) rotate(0deg)} 100%{opacity:0.2;transform:translateY(110vh) rotate(720deg)} }
  </style>
</head>
<body>
  <header class="game-header">
    <a href="../../" class="nav-btn" aria-label="Home">&#127968;</a>
    <span class="game-title">&#127950; Road Race!</span>
    <button class="nav-btn" id="speaker-btn" aria-label="Repeat">&#128266;</button>
  </header>

  <div id="track-wrap">
    <div id="grass-left">
      <span>&#127800;</span><span>&#127795;</span><span>&#127803;</span>
      <span>&#127810;</span><span>&#127801;</span><span>&#127807;</span>
    </div>
    <div id="road">
      <div id="road-markings"></div>
      <div id="finish-line"></div>
      <div id="obstacle"></div>
      <div id="car-wrap"><span id="car">&#127950;</span></div>
    </div>
    <div id="grass-right">
      <span>&#127794;</span><span>&#127802;</span><span>&#127804;</span>
      <span>&#127808;</span><span>&#127800;</span><span>&#127806;</span>
    </div>
  </div>

  <div id="question-area">
    <div id="question-display">
      <span id="q-emoji"></span>
      <span id="q-text"></span>
    </div>
    <div id="answers-grid">
      <button class="answer-btn"></button>
      <button class="answer-btn"></button>
      <button class="answer-btn"></button>
      <button class="answer-btn"></button>
    </div>
  </div>

  <div id="win-screen">
    <div class="win-trophy">&#127942;</div>
    <div class="win-title">You Win! &#127937;</div>
    <div class="win-sub">Amazing driving!</div>
    <button id="play-again-btn">Race Again! &#127950;</button>
  </div>

  <script>
    const QUESTIONS = [
      { q:'What colour is the sun?',       emoji:'&#9728;&#65039;', answers:['Yellow','Blue','Red','Green'],       correct:0 },
      { q:'What colour is the sky?',        emoji:'&#127780;&#65039;',answers:['Blue','Yellow','Pink','Orange'],     correct:0 },
      { q:'What colour is grass?',          emoji:'&#127807;',       answers:['Green','Brown','Blue','Purple'],     correct:0 },
      { q:'What colour is a tomato?',       emoji:'&#127813;',       answers:['Red','Yellow','Blue','Green'],       correct:0 },
      { q:'What colour is a banana?',       emoji:'&#127820;',       answers:['Yellow','Orange','Green','Red'],     correct:0 },
      { q:'What colour is an apple?',       emoji:'&#127822;',       answers:['Red','Blue','Yellow','Purple'],      correct:0 },
      { q:'What colour is a carrot?',       emoji:'&#129365;',       answers:['Orange','Red','Yellow','Blue'],      correct:0 },
      { q:'What colour is the sea?',        emoji:'&#127754;',       answers:['Blue','Green','Red','Yellow'],       correct:0 },
      { q:'What colour is snow?',           emoji:'&#10052;&#65039;',answers:['White','Blue','Grey','Yellow'],      correct:0 },
      { q:'How many sides has a square?',   emoji:'&#128998;',       answers:['4','3','5','6'],                     correct:0 },
      { q:'How many sides has a triangle?', emoji:'&#128314;',       answers:['3','4','2','5'],                     correct:0 },
      { q:'How many fingers on one hand?',  emoji:'&#9995;',         answers:['5','4','3','6'],                     correct:0 },
      { q:'How many legs does a dog have?', emoji:'&#128054;',       answers:['4','2','3','6'],                     correct:0 },
      { q:'How many wheels on a car?',      emoji:'&#128663;',       answers:['4','2','3','5'],                     correct:0 },
      { q:'How many ears do you have?',     emoji:'&#128066;',       answers:['2','1','3','4'],                     correct:0 },
      { q:'What does a cow say?',           emoji:'&#128004;',       answers:['Moo','Woof','Meow','Oink'],          correct:0 },
      { q:'What does a dog say?',           emoji:'&#128054;',       answers:['Woof','Moo','Meow','Baa'],           correct:0 },
      { q:'What does a cat say?',           emoji:'&#128049;',       answers:['Meow','Woof','Moo','Quack'],         correct:0 },
      { q:'What does a duck say?',          emoji:'&#129414;',       answers:['Quack','Moo','Roar','Woof'],         correct:0 },
      { q:'What does a sheep say?',         emoji:'&#128017;',       answers:['Baa','Moo','Woof','Oink'],           correct:0 },
      { q:'What sound does a lion make?',   emoji:'&#129409;',       answers:['Roar','Moo','Meow','Quack'],         correct:0 },
      { q:'What shape is a wheel?',         emoji:'&#127905;',       answers:['Circle','Square','Triangle','Star'], correct:0 },
      { q:'Count the stars: &#11088;&#11088;&#11088;',    emoji:'', answers:['3','2','4','5'], correct:0 },
      { q:'Count the apples: &#127822;&#127822;',         emoji:'', answers:['2','1','3','4'], correct:0 },
      { q:'Count the hearts: &#10084;&#65039;&#10084;&#65039;&#10084;&#65039;&#10084;&#65039;', emoji:'', answers:['4','3','5','2'], correct:0 },
    ];

    const OBSTACLES    = ['&#128738;&#65039;','&#128004;','&#128020;','&#129040;','&#128166;','&#128056;','&#127797;','&#127875;'];
    const CELEBRATIONS = ['Amazing!','Brilliant!','Zooom!','Super!','Wahoo!','Fantastic!'];
    const TOTAL = 8;
    const CAR_START = 6, CAR_END = 88;
    const STEP = (CAR_END - CAR_START) / TOTAL;

    let roundQs = [], currentQ = 0, progress = 0, blocked = false;

    const carWrapEl  = document.getElementById('car-wrap');
    const obstacleEl = document.getElementById('obstacle');
    const markingsEl = document.getElementById('road-markings');
    const qEmojiEl   = document.getElementById('q-emoji');
    const qTextEl    = document.getElementById('q-text');
    const winEl      = document.getElementById('win-screen');
    const btns       = Array.from(document.querySelectorAll('.answer-btn'));

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function speak(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.rate = 0.85; u.pitch = 1.2; u.lang = 'en-GB';
      window.speechSynthesis.speak(u);
    }

    function startGame() {
      roundQs = shuffle(QUESTIONS).slice(0, TOTAL);
      currentQ = 0; progress = 0; blocked = false;
      winEl.classList.remove('show');
      document.querySelectorAll('.confetti-piece').forEach(el => el.remove());
      carWrapEl.style.bottom = CAR_START + '%';
      showQuestion();
    }

    function showQuestion() {
      blocked = false;
      const q = roundQs[currentQ];
      const tagged   = q.answers.map((a, i) => ({ text: a, isCorrect: i === q.correct }));
      const shuffled = shuffle(tagged);

      qEmojiEl.innerHTML = q.emoji;
      qEmojiEl.style.display = q.emoji ? '' : 'none';
      qTextEl.innerHTML = q.q;

      btns.forEach((btn, i) => {
        btn.textContent = shuffled[i].text;
        btn.dataset.correct = shuffled[i].isCorrect;
        btn.classList.remove('wrong');
        btn.disabled = false;
      });

      setTimeout(() => {
        const plainText = q.q.replace(/&#\d+;(‍&#\d+;|&#\d+;)*|[^\u0000-~]/g, '').trim();
        speak(plainText || q.q);
      }, 300);
    }

    function onAnswer(btn) {
      if (blocked) return;
      if (btn.dataset.correct === 'true') {
        blocked = true;
        progress++;
        carWrapEl.style.bottom = (CAR_START + progress * STEP) + '%';
        markingsEl.classList.add('moving');
        setTimeout(() => markingsEl.classList.remove('moving'), 750);
        const msg = CELEBRATIONS[Math.floor(Math.random() * CELEBRATIONS.length)];
        speak(msg);
        if (progress >= TOTAL) {
          setTimeout(showWin, 900);
        } else {
          currentQ++;
          setTimeout(showQuestion, 1000);
        }
      } else {
        btn.classList.remove('wrong'); void btn.offsetWidth; btn.classList.add('wrong');
        // Obstacle appears just ahead of car
        const carBottom = CAR_START + progress * STEP;
        const obsBottom = Math.min(carBottom + 12, 78);
        obstacleEl.style.bottom = obsBottom + '%';
        obstacleEl.innerHTML = OBSTACLES[Math.floor(Math.random() * OBSTACLES.length)];
        obstacleEl.classList.remove('pop'); void obstacleEl.offsetWidth;
        obstacleEl.classList.add('pop');
        carWrapEl.classList.remove('shake'); void carWrapEl.offsetWidth;
        carWrapEl.classList.add('shake');
        speak('Try again!');
        setTimeout(() => { obstacleEl.classList.remove('pop'); }, 1500);
      }
    }

    function showWin() {
      winEl.classList.add('show');
      speak('You win! Amazing driving!');
      launchConfetti();
    }

    function launchConfetti() {
      const colors = ['#e63946','#1d7fc4','#2e9c4b','#f4a100','#e84393','#7b2d8b'];
      for (let i = 0; i < 65; i++) {
        const el = document.createElement('div');
        el.className = 'confetti-piece';
        const s = 8 + Math.random() * 10;
        el.style.cssText = `left:${Math.random()*100}vw;top:-20px;` +
          `background:${colors[Math.floor(Math.random()*colors.length)]};` +
          `border-radius:${Math.random()>.5?'50%':'3px'};` +
          `width:${s}px;height:${s}px;` +
          `animation-duration:${1.5+Math.random()*2}s;` +
          `animation-delay:${Math.random()*0.6}s`;
        document.body.appendChild(el);
        el.addEventListener('animationend', () => el.remove());
      }
    }

    btns.forEach(btn => btn.addEventListener('click', () => onAnswer(btn)));
    document.getElementById('play-again-btn').addEventListener('click', startGame);
    document.getElementById('speaker-btn').addEventListener('click', () => {
      if (roundQs[currentQ]) speak(roundQs[currentQ].q.replace(/&#\d+;(‍&#\d+;|&#\d+;)*/g, '').trim() || roundQs[currentQ].q);
    });

    startGame();
  </script>
</body>
</html>
