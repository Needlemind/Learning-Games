<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Learning Games">
  <title>Learning Games</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Nunito', 'Helvetica Neue', Arial, sans-serif;
      background: #f5f3ff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px 20px;
      user-select: none;
    }
    .app-header {
      text-align: center;
      margin-bottom: 36px;
    }
    .app-icon {
      font-size: clamp(44px, 11vw, 68px);
      line-height: 1;
      margin-bottom: 8px;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.15));
    }
    h1 {
      font-size: clamp(30px, 9vw, 56px);
      font-weight: 900;
      color: #2a2840;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-size: clamp(15px, 4vw, 21px);
      color: #9896b0;
      font-weight: 700;
      margin-top: 4px;
    }
    .games-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      width: 100%;
      max-width: 480px;
    }
    @media (min-width: 560px) {
      .games-grid { grid-template-columns: repeat(3, 1fr); max-width: 680px; gap: 20px; }
    }
    .game-card {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: clamp(22px, 6vw, 36px) 12px;
      border-radius: 24px;
      text-decoration: none;
      transition: transform 0.18s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.15s ease;
      touch-action: manipulation;
      overflow: hidden;
    }
    .game-card::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(170deg, rgba(255,255,255,0.22) 0%, transparent 55%);
      border-radius: inherit;
      pointer-events: none;
    }
    .game-card:active { transform: scale(0.93) !important; }
    @media (hover: hover) { .game-card:hover { transform: translateY(-5px) scale(1.02); } }
    .game-card.colours      { background: linear-gradient(145deg,#ff7e7e,#f07800); box-shadow: 0 12px 28px rgba(240,120,0,0.32), 0 3px 8px rgba(240,120,0,0.18); }
    .game-card.shapes       { background: linear-gradient(145deg,#4fa8f5,#7b2d8b); box-shadow: 0 12px 28px rgba(79,168,245,0.32), 0 3px 8px rgba(79,168,245,0.18); }
    .game-card.letters      { background: linear-gradient(145deg,#38c06e,#d4a800); box-shadow: 0 12px 28px rgba(56,192,110,0.32), 0 3px 8px rgba(56,192,110,0.18); }
    .game-card.word-builder { background: linear-gradient(145deg,#f06ab3,#7b2d8b); box-shadow: 0 12px 28px rgba(240,106,179,0.32), 0 3px 8px rgba(240,106,179,0.18); }
    .game-card.dinosaurs    { background: linear-gradient(145deg,#2ecc71,#1a9c7a); box-shadow: 0 12px 28px rgba(46,204,113,0.32), 0 3px 8px rgba(46,204,113,0.18); }
    .game-card.racing       { background: linear-gradient(145deg,#f05252,#e08a00); box-shadow: 0 12px 28px rgba(240,82,82,0.32), 0 3px 8px rgba(240,82,82,0.18); }
    .game-card.numbers      { background: linear-gradient(145deg,#ffb300,#e64a19); box-shadow: 0 12px 28px rgba(255,179,0,0.35), 0 3px 8px rgba(255,179,0,0.2); }
    .game-emoji {
      font-size: clamp(38px, 10vw, 58px);
      margin-bottom: 10px;
      line-height: 1;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.15));
    }
    .game-label {
      font-size: clamp(16px, 4.2vw, 22px);
      font-weight: 900;
      color: white;
      text-align: center;
      text-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>
  <div class="app-header">
    <div class="app-icon">&#11088;</div>
    <h1>Learning Games</h1>
    <p class="subtitle">Tap a game to play!</p>
  </div>
  <div class="games-grid">
    <a href="games/colours/" class="game-card colours">
      <div class="game-emoji">&#127912;</div>
      <div class="game-label">Colours</div>
    </a>
    <a href="games/shapes/" class="game-card shapes">
      <div class="game-emoji">&#128310;</div>
      <div class="game-label">Shapes</div>
    </a>
    <a href="games/letters/" class="game-card letters">
      <div class="game-emoji">&#128292;</div>
      <div class="game-label">Letters</div>
    </a>
    <a href="games/phonics/" class="game-card word-builder">
      <div class="game-emoji">&#128221;</div>
      <div class="game-label">Word Builder</div>
    </a>
    <a href="games/dinosaurs/" class="game-card dinosaurs">
      <div class="game-emoji">&#129429;</div>
      <div class="game-label">Dino Count!</div>
    </a>
    <a href="games/racing/" class="game-card racing">
      <div class="game-emoji">&#127950;</div>
      <div class="game-label">Number Race!</div>
    </a>
    <a href="games/numbers/" class="game-card numbers">
      <div class="game-emoji">&#127822;</div>
      <div class="game-label">Fruit Numbers</div>
    </a>
  </div>
</body>
</html>
